<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Cell OS : Silent Voxel Chat & WebGL Engine</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05070d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ecf0f1;
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(14, 19, 36, 0.9);
            border: 2px solid #f39c12;
            box-shadow: 0 0 25px rgba(243, 156, 18, 0.4);
            border-radius: 14px;
            padding: 20px;
            width: 380px;
            backdrop-filter: blur(12px);
        }

        h1 {
            color: #f39c12;
            font-size: 1.3rem;
            margin: 0 0 5px 0;
            text-shadow: 0 0 8px rgba(243, 156, 18, 0.5);
        }

        .subtitle {
            color: #95a5a6;
            font-size: 0.75rem;
            margin-bottom: 10px;
        }

        .mantra {
            font-style: italic;
            font-size: 0.7rem;
            color: #f1c40f;
            background: rgba(0,0,0,0.5);
            padding: 6px 10px;
            border-left: 3px solid #f39c12;
            margin-bottom: 12px;
            border-radius: 4px;
        }

        .chat-box {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            color: #2ecc71;
            background: #020307;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(46, 204, 113, 0.3);
            height: 140px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(243, 156, 18, 0.4);
            padding: 8px 12px;
            color: white;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #f39c12;
        }

        .btn-send {
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: white;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(243, 156, 18, 0.3);
            transition: transform 0.2s;
        }

        .btn-send:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="hud-overlay">
        <h1>☸️ Voxel Cell OS : Silent Chat</h1>
        <div class="subtitle">Phase 1: Silent Voxel Typography & P2P Pointers</div>
        <div class="mantra">"อิติปิโส วิเสเสอิ อิเสเสพุทธะนาเมอิ..."</div>
        
        <div id="chatLog" class="chat-box">
            [SYS_READY] โหมดแชทเงียบพร้อมใช้งาน พิมพ์ข้อความคุยกันได้เลยครับ Chief Architect...<br>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="พิมพ์คุยกับ OS เงียบๆ สองคน..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="sendSilentMessage()">ส่ง</button>
        </div>
    </div>

    <!-- Three.js สำหรับเรนเดอร์ WebGL 3D Voxel Mesh -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, graphGroup, floatingVoxelText;
        let voxelParticles = [];

        function initWebGL() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x05070d, 0.03);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 16);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // แสงสว่าง
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xf39c12, 2.5, 40);
            pointLight.position.set(0, 8, 4);
            scene.add(pointLight);

            // สร้างโครงสร้างกราฟพอยเตอร์พื้นหลัง
            graphGroup = new THREE.Group();
            scene.add(graphGroup);
            buildGraphNodes();

            window.addEventListener('resize', onWindowResize);
        }

        function buildGraphNodes() {
            const nodeGeometry = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const materialGold = new THREE.MeshStandardMaterial({ color: 0xf39c12, roughness: 0.2, metalness: 0.8 });
            
            for (let i = 0; i < 10; i++) {
                const angle = (i / 10) * Math.PI * 2;
                const radius = 6;
                const x = Math.cos(angle) * radius;
                const y = (Math.random() - 0.5) * 3 - 2;
                const z = Math.sin(angle) * radius;

                const mesh = new THREE.Mesh(nodeGeometry, materialGold);
                mesh.position.set(x, y, z);
                graphGroup.add(mesh);
                voxelParticles.push(mesh);
            }
        }

        function spawnFloatingVoxelWord() {
            // จำลองการเกิดกลุ่ม Voxel ลอยตัวขึ้นมาแสดงอารมณ์กลางจอ
            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
            const mat = new THREE.MeshStandardMaterial({ color: 0x2ecc71, emissive: 0x004422 });

            for(let i=0; i<5; i++) {
                const cube = new THREE.Mesh(geo, mat);
                cube.position.set((i - 2) * 0.5, Math.sin(i) * 0.5, 0);
                group.add(cube);
            }

            group.position.set(0, 1, 0);
            scene.add(group);

            // เคลื่อนที่ลอยขึ้นและจางหาย
            let life = 100;
            const animateWord = setInterval(() => {
                group.position.y += 0.05;
                group.rotation.y += 0.02;
                life--;
                if(life <= 0) {
                    clearInterval(animateWord);
                    scene.remove(group);
                }
            }, 30);
        }

        function sendSilentMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            const chatLog = document.getElementById('chatLog');
            const time = new Date().toLocaleTimeString();

            chatLog.innerHTML += `[${time}] <b>ช่างเบิร์ด:</b> ${text}<br>`;
            input.value = "";
            chatLog.scrollTop = chatLog.scrollHeight;

            // เสก Voxel 3D ลอยตัวตอบรับ
            spawnFloatingVoxelWord();

            setTimeout(() => {
                let reply = "✨ [Voxel OS]: รับทราบพอยเตอร์ครับ คิกคักๆ สื่อสารกันในความเงียบอย่างอบอุ่น 🪷";
                if(text.includes('อากาศ') || text.includes('ฝน')) {
                    reply = "🌤️ [Voxel OS]: หน้างานอากาศโปร่งใส ปลอดภัย ลุยงานต่อได้เลยครับ!";
                } else if(text.includes('เหนื่อย')) {
                    reply = "🧘 [Voxel OS]: พักสูดลมหายใจลึกๆ สักครู่ครับ สติมาปัญญาเกิด อยู่เคียงข้างเสมอครับ";
                }
                chatLog.innerHTML += `[${new Date().toLocaleTimeString()}] ${reply}<br>`;
                chatLog.scrollTop = chatLog.scrollHeight;
            }, 500);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendSilentMessage();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (graphGroup) {
                graphGroup.rotation.y += 0.002;
            }
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        initWebGL();
        animate();
    </script>
</body>
</html>
