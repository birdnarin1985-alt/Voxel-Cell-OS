<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Cell OS : WebGL Genesis Engine</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05070d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ecf0f1;
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(14, 19, 36, 0.85);
            border: 2px solid #f39c12;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.4);
            border-radius: 12px;
            padding: 20px;
            max-width: 350px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        h1 {
            color: #f39c12;
            font-size: 1.4rem;
            margin: 0 0 5px 0;
            text-shadow: 0 0 8px rgba(243, 156, 18, 0.5);
        }

        .subtitle {
            color: #95a5a6;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .mantra {
            font-style: italic;
            font-size: 0.75rem;
            color: #f1c40f;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-left: 3px solid #f39c12;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .status-box {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            color: #2ecc71;
            background: #020307;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(46, 204, 113, 0.3);
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .btn-genesis {
            width: 100%;
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
            transition: transform 0.2s;
        }

        .btn-genesis:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="hud-overlay">
        <h1>☸️ Voxel Cell OS</h1>
        <div class="subtitle">WebGL Graph & .bhd Pointer Visualizer</div>
        <div class="mantra">"อิติปิโส วิเสเสอิ อิเสเสพุทธะนาเมอิ เมตตาพุทธะตังอิ..."</div>
        
        <div id="statusLog" class="status-box">
            [SYS_INIT] โหลดโครงสร้างกราฟ .bhd และ WebGL Shaders สำเร็จ...<br>
            [MESH] พร้อมเรนเดอร์โหนดไมคอร์ไรซาดิจิทัล 3D
        </div>

        <button class="btn-genesis" onclick="triggerIgnition()">🔥 จุดประกายไฟ WebGL Engine</button>
    </div>

    <!-- โหลด Three.js แบบ Single File ผ่าน CDN เพื่อพลังการเรนเดอร์ WebGL แบบปังเดียวจบ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, graphGroup;
        let isIgnited = false;

        function initWebGL() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x05070d, 0.035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 18);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // แสงสว่างนวลตา
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xf39c12, 2, 50);
            pointLight.position.set(0, 10, 5);
            scene.add(pointLight);

            // สร้างโครงสร้างกราฟพอยเตอร์ .bhd และโหนดไมคอร์ไรซา (Voxel Mesh Network)
            graphGroup = new THREE.Group();
            scene.add(graphGroup);

            buildGraphNodes();

            // Responsive Window Resize
            window.addEventListener('resize', onWindowResize);
        }

        function buildGraphNodes() {
            const nodeGeometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const materialGold = new THREE.MeshStandardMaterial({ 
                color: 0xf39c12, 
                roughness: 0.2, 
                metalness: 0.8,
                emissive: 0x553300
            });
            const materialGreen = new THREE.MeshStandardMaterial({ 
                color: 0x2ecc71, 
                roughness: 0.3, 
                metalness: 0.5,
                emissive: 0x003311
            });

            // สร้างโหนดจำลองโครงข่ายไมคอร์ไรซา
            const nodes = [];
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const radius = 5 + Math.sin(i) * 2;
                const x = Math.cos(angle) * radius;
                const y = (Math.random() - 0.5) * 4;
                const z = Math.sin(angle) * radius;

                const mesh = new THREE.Mesh(nodeGeometry, i % 2 === 0 ? materialGold : materialGreen);
                mesh.position.set(x, y, z);
                graphGroup.add(mesh);
                nodes.push(mesh.position);
            }

            // เชื่อมโยงเส้นกราฟพอยเตอร์ (.bhd pointers) ระหว่างโหนด
            const lineMat = new THREE.LineBasicMaterial({ color: 0xf39c12, transparent: true, opacity: 0.4 });
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    if (nodes[i].distanceTo(nodes[j]) < 7) {
                        const points = [nodes[i], nodes[j]];
                        const geometry = new THREE.BufferGeometry().setFromPoints(points);
                        const line = new THREE.Line(geometry, lineMat);
                        graphGroup.add(line);
                    }
                }
            }
        }

        function triggerIgnition() {
            isIgnited = true;
            const logBox = document.getElementById('statusLog');
            logBox.innerHTML += `[IGNITION] จุดประกายไฟ WebGL สำเร็จ!<br>`;
            logBox.innerHTML += `[SUCCESS] เคอร์เนล Voxel Cell OS พิทักษ์ 'ช่างเบิร์ดโคตรเฟี้ยว' พร้อมใช้งานแล้ว 🪷`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (graphGroup) {
                graphGroup.rotation.y += 0.003;
                if (isIgnited) {
                    graphGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.1;
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // เริ่มรันระบบ WebGL ทันที
        initWebGL();
        animate();
    </script>
</body>
</html>
