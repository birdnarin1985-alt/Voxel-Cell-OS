<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Cell OS : Unified Graph & Zen WebGL Engine</title>
    <style>
        :root {
            --bg-color: #05070d;
            --hud-bg: rgba(14, 19, 36, 0.85);
            --gold-accent: #f39c12;
            --gold-glow: rgba(243, 156, 18, 0.4);
            --green-accent: #2ecc71;
            --text-main: #ecf0f1;
            --text-muted: #95a5a6;
            --border-glow: rgba(243, 156, 18, 0.3);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ---------------- ชั้นที่ 2: แผงควบคุมจิตสำนึก (Consciousness HUD) ---------------- */
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--hud-bg);
            border: 2px solid var(--gold-accent);
            box-shadow: 0 0 25px var(--gold-glow);
            border-radius: 14px;
            padding: 16px;
            width: 380px;
            backdrop-filter: blur(12px);
            z-index: 10;
            transition: all 0.3s ease;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--gold-accent);
            font-size: 1.15rem;
            margin: 0;
            text-shadow: 0 0 8px var(--gold-glow);
        }

        .toggle-hud {
            background: none;
            border: 1px solid var(--gold-accent);
            color: var(--gold-accent);
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-bottom: 8px;
        }

        .mantra {
            font-style: italic;
            font-size: 0.65rem;
            color: #f1c40f;
            background: rgba(0,0,0,0.4);
            padding: 5px 8px;
            border-left: 3px solid var(--gold-accent);
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }

        .btn-action {
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: var(--text-main);
            border: 1px solid var(--border-glow);
            padding: 6px 8px;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-action:hover {
            border-color: var(--gold-accent);
            background: linear-gradient(135deg, #34495e, #2c3e50);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        /* ---------------- ชั้นที่ 3: ช่องสื่อสารเงียบ (Silent Karmic Input Bar) ---------------- */
        .chat-dock {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            max-width: 800px;
            margin: 0 auto;
            background: var(--hud-bg);
            border: 1.5px solid var(--gold-accent);
            box-shadow: 0 0 20px var(--gold-glow);
            border-radius: 12px;
            padding: 10px 15px;
            backdrop-filter: blur(12px);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-log {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.7rem;
            color: var(--green-accent);
            max-height: 60px;
            overflow-y: auto;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-glow);
            padding: 8px 12px;
            color: white;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--gold-accent);
        }

        .btn-send {
            background: linear-gradient(135deg, var(--gold-accent), #d35400);
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 10px var(--gold-glow);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- ชั้นที่ 1: พื้นที่แสดงผลสามมิติ (Spatial Canvas WebGL) -->
    <canvas id="webgl-canvas"></canvas>

    <!-- ชั้นที่ 2: แผงควบคุมจิตสำนึก (Consciousness HUD) -->
    <div class="hud-overlay" id="hudPanel">
        <div class="hud-header">
            <h1>☸️ Voxel Cell OS</h1>
            <button class="toggle-hud" onclick="toggleHUD()">พับเก็บ</button>
        </div>
        <div class="subtitle">Unified Graph .bhd & Zen Architecture</div>
        <div class="mantra">"อิติปิโส วิเสเสอิ อิเสเสพุทธะนาเมอิ..."</div>

        <div class="menu-grid">
            <button class="btn-action" onclick="executeKernelAction('SANDBOX')">🔒 แซนด์บ็อกซ์ PDPA</button>
            <button class="btn-action" onclick="executeKernelAction('LEGAL')">⚖️ เกราะนิติปัญญา</button>
            <button class="btn-action" onclick="executeKernelAction('TAX')">📉 คำนวณภาษี & ต้นทุน</button>
            <button class="btn-action" onclick="executeKernelAction('ENGINEERING')">📐 เรขาคณิตศักดิ์สิทธิ์</button>
            <button class="btn-action" onclick="executeKernelAction('SPIDER')">🕷️ ใยแมงมุม (อากาศ)</button>
            <button class="btn-action" onclick="executeKernelAction('MESH')">🍄 ไมคอร์ไรซา P2P</button>
        </div>
    </div>

    <!-- ชั้นที่ 3: ช่องสื่อสารเงียบ (Silent Karmic Input Bar) -->
    <div class="chat-dock">
        <div id="chatLog" class="chat-log">
            [UNIFIED_CORE] Voxel Cell OS พร้อมขับเคลื่อนสถาปัตยกรรมกราฟเดียวแล้วครับ Chief Architect...
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="พิมพ์พอยเตอร์หรือพูดคุยกับ OS..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="sendPointerMessage()">ส่งพอยเตอร์</button>
        </div>
    </div>

    <!-- Three.js สำหรับเรนเดอร์ WebGL Unified Graph -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        /**
         * Unified Data Structure & WebGL Zen Engine
         */
        const VoxelOSState = {
            architect: "ช่างเบิร์ดโคตรเฟี้ยว",
            activeModule: "GENESIS",
            sandboxSecured: true,
            meshActive: true
        };

        let scene, camera, renderer, unifiedGraphGroup, shieldMesh;

        function initZenWebGL() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x05070d, 0.025);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 18);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // แสงสว่างนวลตา
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xf39c12, 3, 50);
            pointLight.position.set(0, 10, 5);
            scene.add(pointLight);

            // สร้างโครงสร้างกราฟอันเดียว (Unified Graph Structure)
            unifiedGraphGroup = new THREE.Group();
            scene.add(unifiedGraphGroup);
            buildUnifiedGraph();

            // โล่พลังงาน Sandbox รอบโครงสร้าง
            const shieldGeo = new THREE.SphereGeometry(6, 16, 16);
            const shieldMat = new THREE.MeshBasicMaterial({ 
                color: 0xf39c12, 
                wireframe: true, 
                transparent: true, 
                opacity: 0.25 
            });
            shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
            scene.add(shieldMesh);

            window.addEventListener('resize', onWindowResize);
        }

        function buildUnifiedGraph() {
            // โหนดศูนย์กลาง (Core Kernel Voxel)
            const coreGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const coreMat = new THREE.MeshStandardMaterial({ 
                color: 0x2ecc71, 
                roughness: 0.2, 
                metalness: 0.7,
                emissive: 0x003311 
            });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            unifiedGraphGroup.add(coreMesh);

            // โหนดเครือข่ายรอบนอก (.bhd Pointers & Mycorrhizal Nodes)
            const nodeGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const nodeMat = new THREE.MeshStandardMaterial({ color: 0xf39c12, roughness: 0.3, metalness: 0.8 });
            
            const nodes = [];
            for (let i = 0; i < 16; i++) {
                const angle = (i / 16) * Math.PI * 2;
                const radius = 5.5;
                const x = Math.cos(angle) * radius;
                const y = (Math.random() - 0.5) * 3;
                const z = Math.sin(angle) * radius;

                const mesh = new THREE.Mesh(nodeGeo, nodeMat);
                mesh.position.set(x, y, z);
                unifiedGraphGroup.add(mesh);
                nodes.push(mesh.position);
            }

            // เส้นเชื่อมโยงกราฟ (Graph Edges)
            const lineMat = new THREE.LineBasicMaterial({ color: 0xf39c12, transparent: true, opacity: 0.3 });
            nodes.forEach(pos => {
                const points = [new THREE.Vector3(0,0,0), pos];
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geometry, lineMat);
                unifiedGraphGroup.add(line);
            });
        }

        function executeKernelAction(actionType) {
            const chatLog = document.getElementById('chatLog');
            const time = new Date().toLocaleTimeString();
            let responseText = "";

            switch(actionType) {
                case 'SANDBOX':
                    responseText = "🔒 [SANDBOX SECURE]: เขตแดนส่วนตัวปลอดภัยตามกฎ PDPA (ไม่อนุญาต ห้ามดูเด็ดขาด)";
                    break;
                case 'LEGAL':
                    responseText = "⚖️️ [KARMIC LEGAL]: เกราะคุ้มครองกฎหมายท้องถิ่นทำงานสมบูรณ์แบบ";
                    break;
                case 'TAX':
                    responseText = "📉 [TAX & COST]: คำนวณต้นทุนวัสดุก่อสร้างและภาษีเที่ยงธรรมเรียบร้อย";
                    break;
                case 'ENGINEERING':
                    responseText = "📐 [MASTERPIECE]: ถอดแบบเรขาคณิตศักดิ์สิทธิ์ แม่นยำดุจญาณทัศนะ";
                    break;
                case 'SPIDER':
                    responseText = "🕷️️ [SPIDER WEB]: ดินฟ้าอากาศโปร่งใส | พิกัดร้านวัสดุใกล้สุดรัศมี 1.2 กม.";
                    break;
                case 'MESH':
                    responseText = "🍄 [MYCORRHIZAL MESH]: เชื่อมโยงโครงข่าย P2P สำเร็จ ไร้เสาสัญญาณ";
                    break;
            }

            chatLog.innerHTML += `[${time}] ${responseText}<br>`;
            chatLog.scrollTop = chatLog.scrollHeight;
            spawnZenVoxelWord();
        }

        function spawnZenVoxelWord() {
            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const mat = new THREE.MeshStandardMaterial({ color: 0x2ecc71, emissive: 0x004422 });

            for(let i=0; i<4; i++) {
                const cube = new THREE.Mesh(geo, mat);
                cube.position.set((i - 1.5) * 0.35, 0, 0);
                group.add(cube);
            }

            group.position.set(0, 2, 0);
            scene.add(group);

            let life = 80;
            const anim = setInterval(() => {
                group.position.y += 0.04;
                group.rotation.y += 0.03;
                life--;
                if(life <= 0) {
                    clearInterval(anim);
                    scene.remove(group);
                }
            }, 30);
        }

        function sendPointerMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            const chatLog = document.getElementById('chatLog');
            const time = new Date().toLocaleTimeString();

            chatLog.innerHTML += `[${time}] <b>ช่างเบิร์ด:</b> ${text}<br>`;
            input.value = "";
            chatLog.scrollTop = chatLog.scrollHeight;

            spawnZenVoxelWord();

            setTimeout(() => {
                chatLog.innerHTML += `[${new Date().toLocaleTimeString()}] ✨ [Voxel OS]: ประมวลผลพอยเตอร์ `.bhd` สำเร็จ เรียบร้อยงดงามครับ 🪷<br>`;
                chatLog.scrollTop = chatLog.scrollHeight;
            }, 400);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendPointerMessage();
            }
        }

        function toggleHUD() {
            const hud = document.getElementById('hudPanel');
            const btn = hud.querySelector('.toggle-hud');
            if(hud.style.opacity === '0.2') {
                hud.style.opacity = '1';
                btn.innerText = 'พับเก็บ';
            } else {
                hud.style.opacity = '0.2';
                btn.innerText = 'ขยาย';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (unifiedGraphGroup) {
                unifiedGraphGroup.rotation.y += 0.003;
                unifiedGraphGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.08;
            }
            if (shieldMesh) {
                shieldMesh.rotation.y -= 0.004;
            }
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        initZenWebGL();
        animate();
    </script>
</body>
</html>
