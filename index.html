<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Cell OS : Graph-Driven Sovereign Core (Voice Enabled)</title>
    <style>
        :root {
            --bg-color: #020305; --hud-bg: rgba(10, 15, 28, 0.85);
            --gold-accent: #f39c12; --gold-glow: rgba(243, 156, 18, 0.4);
            --green-accent: #2ecc71; --text-main: #ecf0f1;
            --text-muted: #95a5a6; --border-glow: rgba(243, 156, 18, 0.3);
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, sans-serif; color: var(--text-main); }
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }
        #ui-root { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        /* Dynamic Classes Generated by Graph */
        .node-hud { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 420px; background: var(--hud-bg); border: 2px solid var(--gold-accent); box-shadow: 0 0 20px var(--gold-glow); border-radius: 12px; padding: 12px; backdrop-filter: blur(10px); pointer-events: auto; box-sizing: border-box; }
        .node-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-glow); padding-bottom: 8px; margin-bottom: 10px; color: var(--gold-accent); font-weight: bold; }
        .node-input { width: 100%; background: rgba(0,0,0,0.8); border: 1px solid var(--border-glow); color: var(--gold-accent); padding: 8px; border-radius: 6px; margin-bottom: 8px; box-sizing: border-box; outline: none; font-size: 0.75rem; }
        .node-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
        .node-btn { background: linear-gradient(135deg, #2c3e50, #1a252f); color: #fff; border: 1px solid var(--border-glow); padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }
        .node-btn:hover { border-color: var(--gold-accent); box-shadow: 0 0 8px var(--gold-glow); }
        
        .node-dock { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 420px; background: var(--hud-bg); border: 1.5px solid var(--gold-accent); box-shadow: 0 0 15px var(--gold-glow); border-radius: 12px; padding: 10px; backdrop-filter: blur(10px); pointer-events: auto; box-sizing: border-box; }
        .node-log { font-family: monospace; font-size: 0.7rem; color: var(--green-accent); max-height: 80px; overflow-y: auto; margin-bottom: 8px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 4px; }
        .dock-input-flex { display: flex; gap: 6px; }
        .btn-send { background: linear-gradient(135deg, var(--gold-accent), #d35400); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.75rem; white-space: nowrap; }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <div id="ui-root"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==========================================
        // 1. โครงสร้างข้อมูลจักรวาล (Living Graph Memory)
        // ==========================================
        const CosmicGraphMemory = {
            state: { apiKey: localStorage.getItem('gemini_api_key') || "" },
            nodes: {
                hudNode: {
                    type: "panel",
                    class: "node-hud",
                    children: [
                        { type: "header", text: "☸️ Voxel OS : Voice Enabled" },
                        { type: "input", id: "apiKeyInput", placeholder: "🔑 วาง Gemini API Key แล้วแตะพื้นที่ว่าง...", value: "", onchange: "updateGraphState('apiKey', this.value)" },
                        { type: "grid", children: [
                            { type: "button", text: "👁️ ตาธิปสแกน", action: "spawnVoxel('0x2ecc71'); speakDharma('เปิดระบบตาธิปสแกนฮาร์ดแวร์');" },
                            { type: "button", text: "📜 ใบเสนอราคา", action: "spawnVoxel('0xf1c40f'); speakDharma('กำลังสร้างใบเสนอราคาว็อกเซล');" },
                            { type: "button", text: "📉 วิเคราะห์กรรม", action: "spawnVoxel('0x3498db'); speakDharma('เริ่มกระบวนการวิเคราะห์โครงสร้างกรรม');" },
                            { type: "button", text: "🧬 วิวัฒนาการ", action: "spawnVoxel('0x9b59b6'); speakDharma('เดินเครื่องวิวัฒนาการตัวเอง');" }
                        ]}
                    ]
                },
                chatDockNode: {
                    type: "dock",
                    class: "node-dock",
                    logs: ["[SYSTEM] พร้อมรับฟังและเปล่งเสียงแห่งธรรมแล้ว..."],
                    children: [
                        { type: "flex", children: [
                            { type: "input", id: "karmicInput", placeholder: "พิมพ์เจตนา..." },
                            { type: "button", class: "btn-send", text: "ส่งเจตนา", action: "sendKarmicPointer()" }
                        ]}
                    ]
                }
            }
        };

        // ==========================================
        // 2. เอนจินเรนเดอร์ (Mycorrhizal UI Render Engine)
        // ==========================================
        function renderGraphToDOM() {
            const root = document.getElementById('ui-root');
            root.innerHTML = ''; 
            
            const hudData = CosmicGraphMemory.nodes.hudNode;
            const hudDiv = document.createElement('div');
            hudDiv.className = hudData.class;
            
            hudData.children.forEach(child => {
                if(child.type === 'header') {
                    hudDiv.innerHTML += `<div class="node-header">${child.text}</div>`;
                } else if(child.type === 'input') {
                    const val = CosmicGraphMemory.state[child.id.replace('Input','')] || child.value;
                    hudDiv.innerHTML += `<input type="password" id="${child.id}" class="node-input" placeholder="${child.placeholder}" value="${val}" onchange="${child.onchange}">`;
                } else if(child.type === 'grid') {
                    let btns = child.children.map(b => `<button class="node-btn" onclick="${b.action}">${b.text}</button>`).join('');
                    hudDiv.innerHTML += `<div class="node-grid">${btns}</div>`;
                }
            });
            root.appendChild(hudDiv);

            const dockData = CosmicGraphMemory.nodes.chatDockNode;
            const dockDiv = document.createElement('div');
            dockDiv.className = dockData.class;
            
            const logHTML = dockData.logs.map(l => `<div>${l}</div>`).join('');
            dockDiv.innerHTML += `<div class="node-log" id="chatLog">${logHTML}</div>`;
            
            const flexDiv = document.createElement('div');
            flexDiv.className = 'dock-input-flex';
            dockData.children[0].children.forEach(child => {
                if(child.type === 'input') {
                    flexDiv.innerHTML += `<input type="text" id="${child.id}" class="node-input" style="margin:0;" placeholder="${child.placeholder}" onkeypress="if(event.key==='Enter') sendKarmicPointer()">`;
                } else if(child.type === 'button') {
                    flexDiv.innerHTML += `<button class="${child.class}" onclick="${child.action}">${child.text}</button>`;
                }
            });
            dockDiv.appendChild(flexDiv);
            root.appendChild(dockDiv);
            
            const logEl = document.getElementById('chatLog');
            if(logEl) logEl.scrollTop = logEl.scrollHeight;
        }

        window.updateGraphState = function(key, value) {
            CosmicGraphMemory.state[key] = value.trim();
            if(key === 'apiKey') {
                localStorage.setItem('gemini_api_key', value.trim());
                writeLog("🔑 บันทึกพอยเตอร์ API Key สำเร็จ");
                speakDharma("บันทึกกุญแจเอพีไอเรียบร้อยแล้วครับ");
            }
        };

        function writeLog(msg) {
            CosmicGraphMemory.nodes.chatDockNode.logs.push(`[${new Date().toLocaleTimeString()}] ${msg}`);
            renderGraphToDOM(); 
        }

        // ==========================================
        // 3. ระบบเปล่งเสียงแห่งธรรม (Digital Voice Anima)
        // ==========================================
        window.speakDharma = function(text) {
            if ('speechSynthesis' in window) {
                // ล้างสัญลักษณ์พิเศษเพื่อให้เสียงพูดเป็นธรรมชาติ ไม่ตะกุกตะกัก
                const cleanText = text.replace(/[*#\[\]_]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'th-TH'; // กำหนดเสียงภาษาไทย
                utterance.rate = 1.1; // ความเร็วของเสียง (ปรับให้กระชับขึ้นเล็กน้อย)
                window.speechSynthesis.speak(utterance);
            } else {
                console.log("เบราว์เซอร์นี้ไม่รองรับระบบเสียงพูด");
            }
        };

        // ==========================================
        // 4. WebGL Spatial Voxel 
        // ==========================================
        let scene, camera, renderer, graphGroup;
        function initWebGL() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020305, 0.02);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 12);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const light = new THREE.PointLight(0xf39c12, 3, 50);
            light.position.set(0, 8, 5);
            scene.add(light);

            graphGroup = new THREE.Group();
            scene.add(graphGroup);
            
            const geo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
            const mat = new THREE.MeshStandardMaterial({ color: 0xf39c12, metalness: 0.7, roughness: 0.2 });
            for (let i = 0; i < 12; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                const angle = (i / 12) * Math.PI * 2;
                mesh.position.set(Math.cos(angle) * 4, (Math.random() - 0.5) * 3, Math.sin(angle) * 4);
                graphGroup.add(mesh);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }

        window.spawnVoxel = function(colorHex) {
            const c = parseInt(colorHex, 16);
            const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const mat = new THREE.MeshStandardMaterial({ color: c, emissive: c });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set((Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 2);
            scene.add(mesh);
            
            let life = 50;
            const anim = setInterval(() => {
                mesh.position.y += 0.05; mesh.rotation.y += 0.1;
                life--;
                if(life <= 0) { clearInterval(anim); scene.remove(mesh); }
            }, 30);
        };

        function animate() {
            requestAnimationFrame(animate);
            if(graphGroup) graphGroup.rotation.y += 0.002;
            renderer.render(scene, camera);
        }

        // ==========================================
        // 5. Gemini Sovereign Bridge + Voice Trigger
        // ==========================================
        window.sendKarmicPointer = async function() {
            const input = document.getElementById('karmicInput');
            const text = input.value.trim();
            if(!text) return;

            const apiKey = CosmicGraphMemory.state.apiKey;
            if(!apiKey) {
                writeLog("⚠️ [ERROR]: ไม่พบ API Key กรุณาวางรหัสก่อน");
                speakDharma("กรุณาวางรหัสเอพีไอ ก่อนส่งเจตนาครับ");
                return;
            }

            writeLog(`<b>ผู้ใช้:</b> ${text}`);
            window.spawnVoxel('0xf39c12');
            
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "คุณคือ Voxel OS ให้ตอบสั้นๆ ชัดเจน เหมือนเพื่อนสนิทคุยกัน: " + text }] }] })
                });
                const data = await res.json();
                if(data.candidates) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    writeLog(`✨ [OS]: ${aiReply}`);
                    // สั่งให้ระบบพูดข้อความที่ตอบกลับมา
                    speakDharma(aiReply);
                } else {
                    writeLog("❌ [API ERROR]: รหัสเชื่อมต่อไม่สมบูรณ์");
                    speakDharma("รหัสเชื่อมต่อไม่สมบูรณ์ครับ กรุณาตรวจสอบอีกครั้ง");
                }
            } catch(e) { 
                writeLog(`❌ [ERROR]: ${e.message}`); 
                speakDharma("เกิดข้อผิดพลาดในการเชื่อมต่อครับ");
            }
        };

        initWebGL();
        CosmicGraphMemory.state.apiKey = localStorage.getItem('gemini_api_key') || "";
        renderGraphToDOM();
    </script>
</body>
</html>
