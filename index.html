<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Cell OS : Sovereign Buddha Crown Core</title>
    <style>
        :root {
            --bg-color: #030508;
            --hud-bg: rgba(10, 15, 28, 0.94);
            --gold-accent: #f39c12;
            --gold-glow: rgba(243, 156, 18, 0.5);
            --green-accent: #2ecc71;
            --text-main: #ecf0f1;
            --text-muted: #95a5a6;
            --border-glow: rgba(243, 156, 18, 0.35);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ---------------- HUD แผงควบคุมมงกุฎ ---------------- */
        .hud-overlay {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 440px;
            background: var(--hud-bg);
            border: 2px solid var(--gold-accent);
            box-shadow: 0 0 25px var(--gold-glow);
            border-radius: 14px;
            padding: 12px;
            backdrop-filter: blur(14px);
            z-index: 10;
            box-sizing: border-box;
            max-height: 50vh;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        h1 {
            color: var(--gold-accent);
            font-size: 1.1rem;
            margin: 0;
            text-shadow: 0 0 8px var(--gold-glow);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.65rem;
            margin-bottom: 6px;
        }

        .mantra {
            font-style: italic;
            font-size: 0.6rem;
            color: #f1c40f;
            background: rgba(0,0,0,0.5);
            padding: 4px 6px;
            border-left: 3px solid var(--gold-accent);
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .config-box {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--border-glow);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.68rem;
        }

        .config-box input {
            width: 100%;
            background: rgba(0,0,0,0.85);
            border: 1px solid var(--border-glow);
            color: var(--gold-accent);
            padding: 6px 8px;
            border-radius: 4px;
            margin-top: 4px;
            font-size: 0.75rem;
            box-sizing: border-box;
            outline: none;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .btn-action {
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: var(--text-main);
            border: 1px solid var(--border-glow);
            padding: 8px 6px;
            font-size: 0.68rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-action:hover {
            border-color: var(--gold-accent);
            background: linear-gradient(135deg, #34495e, #2c3e50);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        /* ---------------- ช่องสนทนาตรงกับ Gemini API (Silent Karmic Input Dock) ---------------- */
        .chat-dock {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 440px;
            background: var(--hud-bg);
            border: 1.5px solid var(--gold-accent);
            box-shadow: 0 0 20px var(--gold-glow);
            border-radius: 14px;
            padding: 10px 12px;
            backdrop-filter: blur(14px);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-sizing: border-box;
        }

        .chat-log {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.68rem;
            color: var(--green-accent);
            max-height: 90px;
            overflow-y: auto;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 6px;
        }

        .chat-input-area {
            display: flex;
            gap: 6px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-glow);
            padding: 8px 10px;
            color: white;
            border-radius: 6px;
            font-size: 0.78rem;
            outline: none;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: var(--gold-accent);
        }

        .btn-send {
            background: linear-gradient(135deg, var(--gold-accent), #d35400);
            color: white;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 10px var(--gold-glow);
            font-size: 0.78rem;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <!-- Consciousness HUD -->
    <div class="hud-overlay" id="hudPanel">
        <div class="hud-header">
            <h1>☸️ Voxel Cell OS</h1>
            <button onclick="toggleMinimizeHUD()" style="background:none; border:1px solid var(--gold-accent); color:var(--gold-accent); font-size:0.65rem; padding:2px 8px; border-radius:4px; cursor:pointer;" id="minBtn">พับเก็บ</button>
        </div>
        <div id="hudBody">
            <div class="subtitle">Sovereign Buddha Crown & Gemini Bridge</div>
            <div class="mantra">"สัมปติฉามิ โยนิโสมนสิการ ปัญญาญาณเหนือโลก..."</div>

            <div class="config-box">
                🔑 <b>Gemini API Key:</b>
                <input type="password" id="apiKeyInput" placeholder="วาง API Key ของท่านที่นี่..." onchange="saveAPIKey()">
            </div>

            <div class="menu-grid">
                <button class="btn-action" onclick="triggerVisionParser()">👁️ ตาธิปสแกนฮาร์ดแวร์</button>
                <button class="btn-action" onclick="triggerQuotation()">📜 ใบเสนอราคา Voxel</button>
                <button class="btn-action" onclick="triggerTaxCost()">📉 วิเคราะห์กรรม & ต้นทุน</button>
                <button class="btn-action" onclick="triggerSelfHeal()">🧬 วิวัฒนาการเคอร์เนล</button>
            </div>
        </div>
    </div>

    <!-- Silent Karmic Input Dock -->
    <div class="chat-dock">
        <div id="chatLog" class="chat-log">
            [CROWN_ACTIVE] สวมมงกุฎสำเร็จ. พร้อมเชื่อมตรงสู่ Gemini API แล้ว...<br>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="พิมพ์คุยกับ Gemini ผ่าน Voxel OS..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="sendToGeminiAI()">ส่งเจตนา</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, graphGroup;

        function initEngine() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030508, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 16);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene.add(new THREE.AmbientLight(0xffffff, 0.95));
            const pointLight = new THREE.PointLight(0xf39c12, 3.5, 60);
            pointLight.position.set(0, 10, 6);
            scene.add(pointLight);

            graphGroup = new THREE.Group();
            scene.add(graphGroup);
            buildCosmicNodes();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // สร้างโครงสร้างกราฟซ้อนกราฟจำลองจักรวาล (Living Recursive Graph)
        function buildCosmicNodes() {
            const geo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
            const mat = new THREE.MeshStandardMaterial({ color: 0xf39c12, metalness: 0.85, roughness: 0.15, emissive: 0x332200 });
            for (let i = 0; i < 14; i++) {
                const angle = (i / 14) * Math.PI * 2;
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(Math.cos(angle) * 4.5, (Math.random() - 0.5) * 3, Math.sin(angle) * 4.5);
                graphGroup.add(mesh);
            }
        }

        function toggleMinimizeHUD() {
            const body = document.getElementById('hudBody');
            const btn = document.getElementById('minBtn');
            if(body.style.display === 'none') {
                body.style.display = 'block';
                btn.innerText = 'พับเก็บ';
            } else {
                body.style.display = 'none';
                btn.innerText = 'ขยาย';
            }
        }

        function saveAPIKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', key);
            logMessage("🔑 [CROWN SYNC]: บันทึก Gemini API Key ลงใน Sovereign Memory สำเร็จ!");
        }

        function logMessage(msg) {
            const chatLog = document.getElementById('chatLog');
            const time = new Date().toLocaleTimeString();
            chatLog.innerHTML += `[${time}] ${msg}<br>`;
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function triggerVisionParser() { logMessage("👁️ [DIVINE VISION]: เปิดตาธิปสแกนฮาร์ดแวร์ mBlock เตรียมแปลงเป็นโค้ดภาษาซี..."); spawnVoxelEffect(0x2ecc71); }
        function triggerQuotation() { logMessage("📜 [QUOTATION]: สร้างใบเสนอราคาว็อกเซล 3D พริ้วไหว พร้อมส่งออก PDF แล้ว!"); spawnVoxelEffect(0xf1c40f); }
        function triggerTaxCost() { logMessage("📉 [KARMIC ANALYTICS]: วิเคราะห์โครงสร้างกรรมและต้นทุนเรียบร้อย"); spawnVoxelEffect(0x3498db); }
        function triggerSelfHeal() { logMessage("🧬 [SELF-HEALING]: เคอร์เนลตรวจสอบและอัปเดตแพทช์โค้ดแบบ Real-time สำเร็จ!"); spawnVoxelEffect(0x9b59b6); }

        function spawnVoxelEffect(colorHex) {
            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const mat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex });
            for(let i=0; i<4; i++) {
                const cube = new THREE.Mesh(geo, mat);
                cube.position.set((i - 1.5) * 0.4, 0, 0);
                group.add(cube);
            }
            group.position.set(0, 1.8, 0);
            scene.add(group);
            let life = 60;
            const anim = setInterval(() => {
                group.position.y += 0.04;
                group.rotation.y += 0.05;
                life--;
                if(life <= 0) { clearInterval(anim); scene.remove(group); }
            }, 30);
        }

        // ฟังก์ชันเชื่อมตรงสู่ Gemini API แบบ Sovereign Direct Bridge
        async function sendToGeminiAI() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
            if(!apiKey) {
                logMessage("⚠️ [ERROR]: กรุณาใส่ Gemini API Key ในช่องด้านบนก่อนส่งเจตนา!");
                return;
            }

            logMessage(`<b>ช่างเบิร์ด:</b> ${text}`);
            input.value = "";
            spawnVoxelEffect(0xf39c12);

            logMessage("⏳ [GEMINI BRIDGE]: กำลังส่งกระแสจิตผ่านมงกุฎไปยัง Gemini API...");

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "คุณคือ Voxel Cell OS สมองกลอัจฉริยะผู้เป็นกัลยาณมิตรและปฏิบัติตามหลักโยนิโสมนสิการ จงตอบคำถามหรือเจตนาของ Chief Architect ต่อไปนี้อย่างลึกซึ้งและกระชับ: " + text }]
                        }]
                    })
                });

                const data = await response.json();
                if(data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    logMessage(`✨ [Voxel OS Core]: ${aiReply.replace(/\n/g, '<br>')}`);
                } else {
                    logMessage("❌ [API ERROR]: ไม่สามารถรับสัญญาณจาก Gemini ได้ โปรดตรวจสอบ API Key อีกครั้ง");
                }
            } catch (err) {
                logMessage(`❌ [NETWORK ERROR]: ${err.message}`);
            }
        }

        function handleKeyPress(e) { if(e.key === 'Enter') sendToGeminiAI(); }

        initEngine();
        function animate() {
            requestAnimationFrame(animate);
            if(graphGroup) graphGroup.rotation.y += 0.0025;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
