<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Cell OS : Quantum God Mode</title>
    <style>
        :root {
            --bg-color: #000000; /* ดำสนิทเพื่อขับแสง Bloom */
            --hud-bg: rgba(15, 20, 30, 0.4); 
            --hud-border: rgba(0, 243, 255, 0.2);
            --gold-accent: #f39c12; --gold-glow: rgba(243, 156, 18, 0.6);
            --cyan-accent: #00f3ff; --cyan-glow: rgba(0, 243, 255, 0.6);
            --green-accent: #2ecc71; --error-accent: #e74c3c; --text-main: #f8f9fa;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, sans-serif; color: var(--text-main); touch-action: none; }
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }
        
        #camera-feed, #pixel-buffer-canvas { display: none; }

        #ui-root { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px 0; box-sizing: border-box; }
        
        .node-hud, .node-dock { 
            position: relative; margin: 0 auto; width: 92%; max-width: 440px; 
            background: var(--hud-bg); border: 1px solid var(--hud-border); 
            box-shadow: 0 16px 40px 0 rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(0, 243, 255, 0.05); 
            border-radius: 20px; padding: 16px; 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); 
            pointer-events: auto; box-sizing: border-box; transition: all 0.35s ease; 
        }
        
        .node-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 12px; color: var(--cyan-accent); font-weight: bold; font-size: 1.1rem; text-shadow: 0 0 10px var(--cyan-glow); letter-spacing: 1px; }
        .status-dot { width: 10px; height: 10px; background-color: var(--green-accent); border-radius: 50%; box-shadow: 0 0 10px var(--green-accent); animation: pulse 2s infinite; }
        .status-dot.streaming { background-color: var(--cyan-accent); box-shadow: 0 0 15px var(--cyan-accent); animation: fastPulse 0.5s infinite; }
        
        .node-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .node-btn { background: rgba(0, 243, 255, 0.05); color: #fff; border: 1px solid rgba(0, 243, 255, 0.2); padding: 10px; border-radius: 10px; cursor: pointer; font-size: 0.8rem; font-weight: bold; transition: all 0.2s; backdrop-filter: blur(5px); text-align: center; text-transform: uppercase;}
        .node-btn:hover { background: rgba(0, 243, 255, 0.2); border-color: var(--cyan-accent); transform: translateY(-2px); box-shadow: 0 5px 15px var(--cyan-glow); }
        .btn-stream { background: linear-gradient(135deg, #ff0055, #9b59b6); border: none; box-shadow: 0 4px 20px rgba(255,0,85,0.4); }
        .btn-stream:hover { background: linear-gradient(135deg, #ff0055, #c0392b); box-shadow: 0 4px 25px rgba(255,0,85,0.7); }
        
        .node-log { font-family: 'Courier New', monospace; font-size: 0.75rem; color: var(--cyan-accent); max-height: 90px; overflow-y: auto; margin-bottom: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; border-left: 3px solid var(--cyan-accent); }
        
        @keyframes pulse { 0% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.5); } 100% { opacity: 0.4; transform: scale(1); } }
        @keyframes fastPulse { 0% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.8); } 100% { opacity: 0.6; transform: scale(1); } }
    </style>
    
    <!-- ES Module Import Map สำหรับ Three.js และ Post-processing -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="pixel-buffer-canvas"></canvas>
    
    <div id="ui-root"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ==========================================
        // 1. SYSTEM STATE & YONISO PROTOCOL
        // ==========================================
        const ResMatrix = [
            { name: "LOW (7.5k)", w: 100, h: 75, spacing: 0.13, size: 0.11 },
            { name: "HIGH (19.2k)", w: 160, h: 120, spacing: 0.08, size: 0.07 },
            { name: "ULTRA (30k)", w: 200, h: 150, spacing: 0.065, size: 0.055 }
        ];

        window.SexyCellOS = {
            s: { isStreaming: false, currentCam: 'user', resIdx: 1 },
            logs: ["[QUANTUM CORE] โยนิโส gRPC Matrix โหลดสมบูรณ์..."],
            touch: { x: -9999, y: -9999, active: false }
        };

        function writeLog(msg) { window.SexyCellOS.logs.push(`[${new Date().toLocaleTimeString()}] ✨ ${msg}`); window.renderCellDOM(); }
        function speakDharma(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'th-TH'; utterance.rate = 1.15;
                window.speechSynthesis.speak(utterance);
            }
        }

        // ==========================================
        // 2. UI DOM (GLASSMORPHISM)
        // ==========================================
        window.renderCellDOM = function() {
            const root = document.getElementById('ui-root'); root.innerHTML = ''; 
            const isStream = window.SexyCellOS.s.isStreaming;
            const resName = ResMatrix[window.SexyCellOS.s.resIdx].name;
            const camName = window.SexyCellOS.s.currentCam === 'user' ? 'กล้องหน้า' : 'กล้องหลัง';
            
            const hudDiv = document.createElement('div'); hudDiv.className = 'node-hud';
            hudDiv.innerHTML = `
                <div class="node-header">
                    <span>🌌 Voxel God Mode</span>
                    <div class="status-dot ${isStream ? 'streaming' : ''}"></div>
                </div>
                <div class="node-grid">
                    <button class="node-btn" onclick="toggleCamera()">🔄 ${camName}</button>
                    <button class="node-btn" onclick="toggleRes()">✨ ${resName}</button>
                </div>
                <button class="node-input btn-stream" style="color:white; width:100%; margin-top:5px; font-weight:bold; font-size:1rem;" onclick="toggleDivineEye()">
                    ${isStream ? '🔴 ดับตาทิพย์' : '👁️ เปิดตาทิพย์ (QUANTUM STREAM)'}
                </button>
            `;
            root.appendChild(hudDiv);

            const dockDiv = document.createElement('div'); dockDiv.className = 'node-dock';
            const logHTML = window.SexyCellOS.logs.map(l => `<div>${l}</div>`).join('');
            dockDiv.innerHTML = `<div class="node-log" id="chatLog">${logHTML}</div>`;
            root.appendChild(dockDiv);
            
            const logEl = document.getElementById('chatLog'); if(logEl) logEl.scrollTop = logEl.scrollHeight;
        }

        window.toggleCamera = async function() {
            window.SexyCellOS.s.currentCam = window.SexyCellOS.s.currentCam === 'user' ? 'environment' : 'user';
            writeLog(`สลับเป็น ${window.SexyCellOS.s.currentCam === 'user' ? 'กล้องหน้า' : 'กล้องหลัง'}`);
            if(window.SexyCellOS.s.isStreaming) await window.startStream(); 
            else window.renderCellDOM();
        };

        window.toggleRes = function() {
            window.SexyCellOS.s.resIdx = (window.SexyCellOS.s.resIdx + 1) % ResMatrix.length;
            writeLog(`ปรับความละเอียด Voxel: ${ResMatrix[window.SexyCellOS.s.resIdx].name}`);
            window.renderCellDOM();
        };

        // ==========================================
        // 3. THREE.JS QUANTUM ENGINE + BLOOM COMPOSER
        // ==========================================
        let scene, camera, renderer, composer, voxelInstancedMesh, coreGroup;
        const dummy = new THREE.Object3D(); 
        const colorTemp = new THREE.Color();
        const MAX_VOXELS = 30000; 

        function initWebGL() {
            scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x000000, 0.04);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000); 
            camera.position.set(0, 0, 10);
            
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight); 
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ReinhardToneMapping;

            // แสงสว่าง
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const pLight = new THREE.PointLight(0x00f3ff, 2, 20); pLight.position.set(0, 0, 5); scene.add(pLight);

            // POST-PROCESSING: Quantum Bloom Effect
            const renderScene = new RenderPass(scene, camera);
            // Resolution, strength, radius, threshold
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.6, 0.1);
            
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // Voxel Material: ใช้ MeshBasic เพื่อให้เรืองแสงเต็มที่
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
            
            voxelInstancedMesh = new THREE.InstancedMesh(geometry, material, MAX_VOXELS);
            voxelInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            voxelInstancedMesh.visible = false; 
            scene.add(voxelInstancedMesh);

            coreGroup = new THREE.Group(); scene.add(coreGroup);
            const geoCore = new THREE.IcosahedronGeometry(2, 1);
            const matCore = new THREE.MeshBasicMaterial({color: 0x00f3ff, wireframe:true});
            coreGroup.add(new THREE.Mesh(geoCore, matCore));

            window.addEventListener('resize', () => { 
                camera.aspect = window.innerWidth / window.innerHeight; 
                camera.updateProjectionMatrix(); 
                renderer.setSize(window.innerWidth, window.innerHeight); 
                composer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }

        // ==========================================
        // 4. TOUCH / MOUSE PHYSICS (INTERACTIVE RIPPLE)
        // ==========================================
        const updateTouch = (e) => {
            let cx = e.touches ? e.touches[0].clientX : e.clientX;
            let cy = e.touches ? e.touches[0].clientY : e.clientY;
            // Map to 3D World Approx (Scale by 15 for ortho fit)
            window.SexyCellOS.touch.x = (cx / window.innerWidth) * 2 - 1;
            window.SexyCellOS.touch.y = -(cy / window.innerHeight) * 2 + 1;
            window.SexyCellOS.touch.x *= 8; 
            window.SexyCellOS.touch.y *= 6;
            window.SexyCellOS.touch.active = true;
        };
        const endTouch = () => { window.SexyCellOS.touch.active = false; };
        
        window.addEventListener('mousemove', updateTouch);
        window.addEventListener('touchmove', updateTouch);
        window.addEventListener('mousedown', () => window.SexyCellOS.touch.active = true);
        window.addEventListener('mouseup', endTouch);
        window.addEventListener('touchend', endTouch);

        // ==========================================
        // 5. AUDIO-REACTIVE ENGINE (WEB AUDIO API)
        // ==========================================
        let audioContext, analyser, dataArray;
        function initAudio(stream) {
            if(!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser); // ไม่ปล่อยเสียงออกลำโพง ป้องกันไมค์หอน
        }

        // ==========================================
        // 6. DIVINE EYE STREAM (GOD MODE LOOP)
        // ==========================================
        const videoEl = document.getElementById('camera-feed');
        const bufferCanvas = document.getElementById('pixel-buffer-canvas');
        const ctx = bufferCanvas.getContext('2d', { willReadFrequently: true });
        let streamTrack = null, audioTrack = null, animationFrameId = null;

        window.toggleDivineEye = async function() {
            if (window.SexyCellOS.s.isStreaming) window.stopStream();
            else await window.startStream();
        }

        window.startStream = async function() {
            if (streamTrack) streamTrack.stop();
            if (audioTrack) audioTrack.stop();
            
            try {
                // ขออนุญาตทั้งภาพและเสียง
                const constraints = { video: { facingMode: window.SexyCellOS.s.currentCam, width: { ideal: 640 } }, audio: true };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                videoEl.srcObject = stream;
                streamTrack = stream.getVideoTracks()[0];
                if(stream.getAudioTracks().length > 0) audioTrack = stream.getAudioTracks()[0];
                
                initAudio(stream);

                await new Promise(resolve => videoEl.onloadedmetadata = resolve);
                videoEl.play();

                window.SexyCellOS.s.isStreaming = true;
                coreGroup.visible = false; 
                voxelInstancedMesh.visible = true; 
                
                writeLog("ตาทิพย์ควอนตัมเชื่อมต่อสมบูรณ์ (ภาพ+เสียง+ฟิสิกส์)");
                speakDharma("เปิดระบบตาทิพย์ขั้นสูงสุดแล้วครับ");
                window.renderCellDOM();
                
                processStreamBuffer(); 
            } catch (err) {
                writeLog(`[STREAM ERROR]: ${err.message}`);
                speakDharma("เกิดข้อผิดพลาดในการเข้าถึงอุปกรณ์ครับ");
            }
        }

        window.stopStream = function() {
            if (streamTrack) streamTrack.stop();
            if (audioTrack) audioTrack.stop();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            videoEl.srcObject = null; window.SexyCellOS.s.isStreaming = false;
            voxelInstancedMesh.visible = false; coreGroup.visible = true;
            writeLog("ดับกระแสจิตตาทิพย์"); speakDharma("ปิดระบบตาทิพย์ครับ");
            window.renderCellDOM();
        }

        let timeOffset = 0;

        function processStreamBuffer() {
            if (!window.SexyCellOS.s.isStreaming) return;
            
            timeOffset += 0.05;
            const res = ResMatrix[window.SexyCellOS.s.resIdx];
            bufferCanvas.width = res.w; bufferCanvas.height = res.h;
            ctx.drawImage(videoEl, 0, 0, res.w, res.h);
            const imgData = ctx.getImageData(0, 0, res.w, res.h).data;
            
            // ดึงค่าเสียง
            let audioBass = 0;
            if(analyser) {
                analyser.getByteFrequencyData(dataArray);
                audioBass = (dataArray[0] + dataArray[1] + dataArray[2]) / 3 / 255.0; // ค่า 0.0 - 1.0
            }
            
            const offsetX = (res.w * res.spacing) / 2;
            const offsetY = (res.h * res.spacing) / 2;
            const isFrontCam = (window.SexyCellOS.s.currentCam === 'user');
            const tx = window.SexyCellOS.touch.x;
            const ty = window.SexyCellOS.touch.y;
            const isTouching = window.SexyCellOS.touch.active;

            let instanceIdx = 0;

            for (let y = 0; y < res.h; y++) {
                for (let x = 0; x < res.w; x++) {
                    const dataIdx = (y * res.w + x) * 4;
                    const r = imgData[dataIdx];
                    const g = imgData[dataIdx + 1];
                    const b = imgData[dataIdx + 2];
                    
                    const brightness = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
                    
                    // DARK MATTER MASKING: สกัดความว่าง (ถ้ามืดไป ไม่เรนเดอร์)
                    if (brightness < 0.12) continue;

                    const targetX = isFrontCam ? (res.w - x - 1) : x; 
                    let posX = (targetX * res.spacing) - offsetX;
                    let posY = -(y * res.spacing) + offsetY;
                    
                    // AUDIO-REACTIVE: นูนตามเสียงและความสว่าง
                    let posZ = (brightness * 2.5) + (audioBass * 1.5); 
                    
                    // RIPPLE PHYSICS: แรงผลักจากนิ้วสัมผัส
                    if (isTouching) {
                        let dx = posX - tx;
                        let dy = posY - ty;
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        if(dist < 2.5) { // รัศมีแรงผลัก
                            let force = (2.5 - dist) * 1.5;
                            posX += (dx / dist) * force;
                            posY += (dy / dist) * force;
                            posZ += force * 2; // กระเด็นมาข้างหน้า
                        }
                    }

                    // สร้างการกระเพื่อมของออร่าเล็กน้อย
                    posZ += Math.sin(timeOffset + posX) * 0.1;

                    dummy.position.set(posX, posY, posZ);
                    
                    // ขนาดก้อน Voxel ขยายตามเสียง
                    let dynamicSize = res.size * (0.8 + (audioBass * 0.5));
                    dummy.scale.set(dynamicSize, dynamicSize, dynamicSize);
                    
                    dummy.updateMatrix();
                    voxelInstancedMesh.setMatrixAt(instanceIdx, dummy.matrix);
                    
                    // เสริมสีให้จัดจ้านขึ้นเพื่อป้อนให้ Bloom Pass
                    colorTemp.setRGB(r/200, g/200, b/200); 
                    voxelInstancedMesh.setColorAt(instanceIdx, colorTemp);
                    
                    instanceIdx++;
                }
            }
            
            voxelInstancedMesh.count = instanceIdx; 
            voxelInstancedMesh.instanceMatrix.needsUpdate = true;
            voxelInstancedMesh.instanceColor.needsUpdate = true;
            
            const time = Date.now() * 0.001;
            voxelInstancedMesh.rotation.y = Math.sin(time * 0.2) * 0.15;
            voxelInstancedMesh.rotation.x = Math.cos(time * 0.15) * 0.05;

            animationFrameId = requestAnimationFrame(processStreamBuffer);
        }

        function animate() {
            requestAnimationFrame(animate);
            if(coreGroup && coreGroup.visible) { 
                coreGroup.rotation.y += 0.01; 
                coreGroup.rotation.x += 0.005; 
            }
            // ใช้ Composer แทน Renderer ปกติเพื่อให้เกิดแสง Bloom
            composer.render();
        }

        initWebGL(); window.renderCellDOM();
    </script>
</body>
</html>
