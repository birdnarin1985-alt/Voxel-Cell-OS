<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Cell OS : Divine Eye Stream</title>
    <style>
        :root {
            --bg-color: #010204; 
            --hud-bg: rgba(255, 255, 255, 0.03); 
            --hud-border: rgba(255, 255, 255, 0.12);
            --gold-accent: #f39c12; --gold-glow: rgba(243, 156, 18, 0.4);
            --cyan-accent: #00f3ff; --cyan-glow: rgba(0, 243, 255, 0.4);
            --green-accent: #2ecc71; --error-accent: #e74c3c; --text-main: #f8f9fa;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, sans-serif; color: var(--text-main); }
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }
        
        /* สตรีมกล้องและ Canvas ที่ซ่อนไว้เพื่อสกัดข้อมูล Buffer */
        #camera-feed, #pixel-buffer-canvas { display: none; }

        #ui-root { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px 0; box-sizing: border-box; }
        
        /* Ultra-Glassmorphism UI */
        .node-hud, .node-dock { 
            position: relative; margin: 0 auto; width: 92%; max-width: 440px; 
            background: var(--hud-bg); border: 1px solid var(--hud-border); 
            box-shadow: 0 16px 40px 0 rgba(0, 0, 0, 0.45), inset 0 0 25px rgba(255, 255, 255, 0.02); 
            border-radius: 20px; padding: 16px; 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            pointer-events: auto; box-sizing: border-box; transition: all 0.35s cubic-bezier(0.15, 0.85, 0.35, 1.2); 
        }
        
        .node-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 8px; margin-bottom: 12px; color: var(--gold-accent); font-weight: bold; font-size: 1rem; text-shadow: 0 0 10px var(--gold-glow); }
        .status-dot { width: 8px; height: 8px; background-color: var(--green-accent); border-radius: 50%; box-shadow: 0 0 10px var(--green-accent); animation: pulse 2s infinite; }
        .status-dot.streaming { background-color: var(--cyan-accent); box-shadow: 0 0 15px var(--cyan-accent); animation: fastPulse 0.5s infinite; }
        
        .node-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .node-btn { background: rgba(255,255,255,0.04); color: #fff; border: 1px solid rgba(255,255,255,0.12); padding: 10px; border-radius: 10px; cursor: pointer; font-size: 0.75rem; font-weight: bold; transition: all 0.2s; backdrop-filter: blur(5px); text-align: center;}
        .node-btn:hover { background: rgba(0, 243, 255, 0.15); border-color: var(--cyan-accent); transform: translateY(-2px); box-shadow: 0 5px 15px var(--cyan-glow); }
        .btn-stream { background: linear-gradient(135deg, #8e44ad, #9b59b6); border: none; box-shadow: 0 4px 15px rgba(142,68,173,0.4); }
        
        .node-log { font-family: 'Courier New', monospace; font-size: 0.72rem; color: var(--green-accent); max-height: 90px; overflow-y: auto; margin-bottom: 10px; background: rgba(0,0,0,0.45); padding: 8px; border-radius: 8px; border-left: 3px solid var(--green-accent); }
        .node-log .error { color: var(--error-accent); border-left-color: var(--error-accent); }
        
        @keyframes pulse { 0% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } 100% { opacity: 0.4; transform: scale(1); } }
        @keyframes fastPulse { 0% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.5); } 100% { opacity: 0.6; transform: scale(1); } }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="pixel-buffer-canvas"></canvas>
    
    <div id="ui-root"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==========================================
        // 1. YONISO gRPC STATE & SCHEMAS
        // ==========================================
        const SexyCellOS = {
            s: { v: "main", isStreaming: false },
            logs: ["[YONISO KERNEL] Holographic & gRPC Engine Ready."],
        };

        function writeLog(msg, isErr = false) { 
            const prefix = isErr ? "❌" : "✨";
            SexyCellOS.logs.push(`[${new Date().toLocaleTimeString()}] ${prefix} ${msg}`); 
            renderCellDOM(); 
        }

        function speakDharma(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'th-TH'; utterance.rate = 1.15;
                window.speechSynthesis.speak(utterance);
            }
        }

        // ==========================================
        // 2. ULTRA-GLASS UI DOM
        // ==========================================
        function renderCellDOM() {
            const root = document.getElementById('ui-root'); root.innerHTML = ''; 
            const isStream = SexyCellOS.s.isStreaming;
            
            const hudDiv = document.createElement('div'); hudDiv.className = 'node-hud';
            hudDiv.innerHTML = `
                <div class="node-header">
                    <span>☸️ Voxel Cell OS</span>
                    <div class="status-dot ${isStream ? 'streaming' : ''}"></div>
                </div>
                <div class="node-grid">
                    <button class="node-btn" onclick="writeLog('ระบบ API ถูกระงับชั่วคราวเพื่อโชว์ Voxel')">👁️ สแกนโครงสร้าง</button>
                    <button class="node-btn btn-stream" onclick="toggleDivineEye()">
                        ${isStream ? '🔴 ปิดตาทิพย์' : '👁️ เปิดตาทิพย์ (Voxel Stream)'}
                    </button>
                </div>
            `;
            root.appendChild(hudDiv);

            const dockDiv = document.createElement('div'); dockDiv.className = 'node-dock';
            const logHTML = SexyCellOS.logs.map(l => `<div class="${l.includes('❌') ? 'error' : ''}">${l}</div>`).join('');
            dockDiv.innerHTML = `<div class="node-log" id="chatLog">${logHTML}</div>`;
            root.appendChild(dockDiv);
            
            const logEl = document.getElementById('chatLog'); if(logEl) logEl.scrollTop = logEl.scrollHeight;
        }

        // ==========================================
        // 3. THREE.JS QUANTUM VOXEL ENGINE (INSTANCED)
        // ==========================================
        let scene, camera, renderer, voxelInstancedMesh;
        let particles = [], coreGroup;
        const dummy = new THREE.Object3D(); 
        const colorTemp = new THREE.Color();
        
        // กำหนดความละเอียดของ Voxel Grid (ตัวแปรสำคัญของ Yoniso Buffer)
        // 100 x 75 = 7,500 Voxels (สวยงามและลื่นไหลบนมือถือ)
        const RES_W = 100; 
        const RES_H = 75;  
        const VOXEL_COUNT = RES_W * RES_H;
        const VOXEL_SIZE = 0.12;
        const SPACING = 0.13;

        function initWebGL() {
            scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x010204, 0.03);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000); 
            camera.position.set(0, 0, 10);
            
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight); 
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // แสงสว่าง
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const pLight = new THREE.PointLight(0x00f3ff, 2, 20); pLight.position.set(0, 5, 5); scene.add(pLight);
            
            // เตรียม InstancedMesh สำหรับตาทิพย์ (สร้าง Voxel นับหมื่นลอจิก)
            const geometry = new THREE.BoxGeometry(VOXEL_SIZE, VOXEL_SIZE, VOXEL_SIZE);
            const material = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1 });
            
            voxelInstancedMesh = new THREE.InstancedMesh(geometry, material, VOXEL_COUNT);
            voxelInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            voxelInstancedMesh.visible = false; // ซ่อนไว้จนกว่าจะเปิดกล้อง
            
            // ใส่สีตั้งต้นเป็นสีดำ
            for (let i = 0; i < VOXEL_COUNT; i++) {
                dummy.position.set(0, 0, 0); dummy.updateMatrix();
                voxelInstancedMesh.setMatrixAt(i, dummy.matrix);
                voxelInstancedMesh.setColorAt(i, new THREE.Color(0x000000));
            }
            scene.add(voxelInstancedMesh);

            // โครงสร้างหมุนเล่นตอนปกติ
            coreGroup = new THREE.Group(); scene.add(coreGroup);
            const coreMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,1.5), new THREE.MeshPhysicalMaterial({color: 0x111111, wireframe:true}));
            coreGroup.add(coreMesh);

            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
            animate();
        }

        // ==========================================
        // 4. DIVINE EYE STREAM (Yoniso gRPC Buffer Logic)
        // ==========================================
        const videoEl = document.getElementById('camera-feed');
        const bufferCanvas = document.getElementById('pixel-buffer-canvas');
        bufferCanvas.width = RES_W; bufferCanvas.height = RES_H;
        const ctx = bufferCanvas.getContext('2d', { willReadFrequently: true });
        
        let streamTrack = null;
        let animationFrameId = null;

        window.toggleDivineEye = async function() {
            if (SexyCellOS.s.isStreaming) {
                stopStream();
            } else {
                await startStream();
            }
        }

        async function startStream() {
            try {
                // ขออนุญาตใช้กล้องหน้า (เหมาะสำหรับมือถือ)
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 320 } }, audio: false });
                videoEl.srcObject = stream;
                streamTrack = stream.getTracks()[0];
                
                await new Promise(resolve => videoEl.onloadedmetadata = resolve);
                videoEl.play();
                
                SexyCellOS.s.isStreaming = true;
                coreGroup.visible = false; // ซ่อนวงแหวนตรงกลาง
                voxelInstancedMesh.visible = true; // โชว์ Voxel Grid
                
                writeLog("[YONISO STREAM]: เชื่อมต่อกระแสจิตกล้องตาทิพย์สำเร็จ");
                speakDharma("เปิดระบบตาทิพย์แล้วครับ");
                renderCellDOM();
                
                processStreamBuffer(); // เริ่ม Loop ดึง Buffer
            } catch (err) {
                writeLog(`[STREAM ERROR]: ${err.message}`, true);
                speakDharma("ไม่สามารถเข้าถึงตาทิพย์ได้ครับ");
            }
        }

        function stopStream() {
            if (streamTrack) streamTrack.stop();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            videoEl.srcObject = null;
            SexyCellOS.s.isStreaming = false;
            voxelInstancedMesh.visible = false;
            coreGroup.visible = true;
            writeLog("[YONISO STREAM]: ปิดกระแสจิตตาทิพย์");
            speakDharma("ปิดระบบตาทิพย์ครับ");
            renderCellDOM();
        }

        // หัวใจหลักของ Yoniso gRPC: นำ Raw Pixels ไปยัดใส่ GPU Buffer ดิบๆ
        function processStreamBuffer() {
            if (!SexyCellOS.s.isStreaming) return;
            
            // 1. วาดวิดีโอลง Canvas ขนาดย่อ (Downsample)
            ctx.drawImage(videoEl, 0, 0, RES_W, RES_H);
            
            // 2. ดึง Uint8ClampedArray (Linear Buffer)
            const imgData = ctx.getImageData(0, 0, RES_W, RES_H).data;
            
            const offsetX = (RES_W * SPACING) / 2;
            const offsetY = (RES_H * SPACING) / 2;

            let instanceIdx = 0;

            // 3. แปลง Buffer เป็น Voxel Vector & RGB ตรงเข้า GPU
            for (let y = 0; y < RES_H; y++) {
                for (let x = 0; x < RES_W; x++) {
                    const dataIdx = (y * RES_W + x) * 4;
                    const r = imgData[dataIdx];
                    const g = imgData[dataIdx + 1];
                    const b = imgData[dataIdx + 2];
                    
                    // คำนวณความสว่าง (Luminance) เพื่อทำ Depth Z-axis (พิกเซลสว่างจะนูนออกมา)
                    const brightness = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
                    const z = brightness * 3.5; // ความนูน (Depth Scale)
                    
                    // กลับซ้ายขวาให้เหมือนกระจก (Mirror)
                    const mirrorX = RES_W - x - 1; 

                    dummy.position.set(
                        (mirrorX * SPACING) - offsetX, 
                        -(y * SPACING) + offsetY, 
                        z
                    );
                    dummy.updateMatrix();
                    
                    // อัปเดต Buffer เข้า InstancedMesh
                    voxelInstancedMesh.setMatrixAt(instanceIdx, dummy.matrix);
                    
                    colorTemp.setRGB(r/255, g/255, b/255);
                    voxelInstancedMesh.setColorAt(instanceIdx, colorTemp);
                    
                    instanceIdx++;
                }
            }
            
            // 4. สั่ง GPU อัปเดตเฟรม (Zero Object Creation per frame)
            voxelInstancedMesh.instanceMatrix.needsUpdate = true;
            voxelInstancedMesh.instanceColor.needsUpdate = true;
            
            // หมุนจอเล็กน้อยให้เห็นความลึก
            const time = Date.now() * 0.001;
            voxelInstancedMesh.rotation.y = Math.sin(time * 0.5) * 0.3;
            voxelInstancedMesh.rotation.x = Math.cos(time * 0.3) * 0.1;

            animationFrameId = requestAnimationFrame(processStreamBuffer);
        }

        // ==========================================
        // 5. RENDER LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            if(coreGroup && coreGroup.visible) { 
                coreGroup.rotation.y += 0.006; coreGroup.rotation.x += 0.002; 
            }
            renderer.render(scene, camera);
        }

        initWebGL(); renderCellDOM();
    </script>
</body>
</html>
