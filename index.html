<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Cell OS - Bhuridat Karmic Graph System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #010201; color: #EAEAEA; font-family: monospace; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #os-hud {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(0, 20, 10, 0.85); border: 1px solid #00FFCC; padding: 15px 25px;
            border-radius: 8px; pointer-events: auto; backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0,255,204,0.2);
        }
        .os-btn {
            background: #002B1D; border: 1px solid #00FFCC; color: #00FFCC;
            padding: 8px 15px; margin: 5px 5px 5px 0; cursor: pointer; font-family: monospace;
            border-radius: 4px; transition: 0.2s;
        }
        .os-btn:hover { background: #00FFCC; color: #000; box-shadow: 0 0 10px #00FFCC; }
    </style>
</head>
<body>

    <div id="os-hud">
        <div style="color: #D4AF37; font-weight: bold; margin-bottom: 8px;">🌌 VOXEL CELL OS [Karmic Core v1.0]</div>
        <div>สถานะพอยเตอร์ในระบบ: <span id="ptr-count" style="color: #00FFCC;">0</span> เส้นกรรม</div>
        <div style="margin-top: 10px;">
            <button class="os-btn" onclick="OS_Kernel.recordKarma('SUCCESS')">💾 บันทึกวิถีถูก (.bhd)</button>
            <button class="os-btn" onclick="OS_Kernel.recordKarma('ERROR')">⚠️ บันทึกบทเรียนผิด</button>
            <button class="os-btn" onclick="OS_Kernel.bootFromGraph()" style="border-color:#D4AF37; color:#D4AF37;">🔄 Boot OS จากกราฟ</button>
        </div>
    </div>

    <canvas id="os-canvas"></canvas>

    <script>
        const canvas = document.getElementById('os-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ----------------------------------------------------------------------
        // 1. THE KARMIC GRAPH DATABASE (สถาปัตยกรรมกราฟซ้อนกราฟ & พอยเตอร์)
        // ----------------------------------------------------------------------
        class KarmicNode {
            constructor(id, type, stateData) {
                this.id = id;               // ID โหนด
                this.type = type;           // TERRAIN, UI_TEXT, ERROR_LESSON, SUCCESS_PATTERN
                this.state = stateData;     // ข้อมูลดิบหรือค่าพารามิเตอร์
                this.pointers = [];         // เส้นกรรมที่ชี้ไปยัง Node อื่น (Edges)
            }
            addPointer(targetNode, karmicWeight) {
                this.pointers.push({ target: targetNode, weight: karmicWeight });
            }
        }

        class VoxelCellOS_Kernel {
            constructor() {
                this.universeGraph = new Map(); // คลังเก็บ Node ทั้งหมดในจักรวาล
                this.rootNode = null;
                this.memoryBuffer = [];         // Voxel อนุภาคสะสม
                this.initUniverse();
            }

            // เริ่มต้นสร้างจักรวาลจำลอง
            initUniverse() {
                // สร้าง Root Node ของ OS
                let root = new KarmicNode("OS_ROOT", "SYSTEM", { status: "AWAKE" });
                
                // สร้าง Node ความทรงจำความสำเร็จ (Success Pattern)
                let successMemory = new KarmicNode("MEM_SUCCESS_01", "SUCCESS_PATTERN", { volume: 1500, status: "STABLE" });
                successMemory.addPointer(root, 1.0);

                // สร้าง Node บทเรียนความผิดพลาด (Error Lesson - ดินสไลด์หน้าฝน)
                let errorMemory = new KarmicNode("MEM_ERROR_01", "ERROR_LESSON", { volume: 800, status: "LANDSLIDE_FAILURE" });
                errorMemory.addPointer(root, -0.5);

                this.universeGraph.set(root.id, root);
                this.universeGraph.set(successMemory.id, successMemory);
                this.universeGraph.set(errorMemory.id, errorMemory);
                this.rootNode = root;
                
                this.updateHUD();
            }

            // บันทึกวิบากกรรม (Serializing to .bhd Pointer Format)
            recordKarma(type) {
                let newId = `KARMA_${Date.now()}`;
                let newNode = new KarmicNode(newId, type, { 
                    timestamp: Date.now(),
                    pointerStrength: Math.random() 
                });
                newNode.addPointer(this.rootNode, type === 'SUCCESS' ? 1.0 : -1.0);
                
                this.universeGraph.set(newNode.id, newNode);
                this.updateHUD();
                
                // เอฟเฟกต์กระพริบพอยเตอร์
                triggerMatrixPulse(type === 'SUCCESS' ? '#00FFCC' : '#FF4D4D');
            }

            // Boot OS จากกราฟพอยเตอร์ (Deserialization & Traversal)
            bootFromGraph() {
                this.memoryBuffer = [];
                // เดินจงกรม (Traversal) ผ่านเส้นกรรมทั้งหมดในจักรวาล
                this.universeGraph.forEach((node, id) => {
                    let color = node.type === 'SUCCESS_PATTERN' ? '#D4AF37' : 
                                node.type === 'ERROR_LESSON' ? '#FF4D4D' : '#00FFCC';
                    
                    // แปลงกราฟเป็นอนุภาค Voxel กลางจอ
                    for(let i=0; i<30; i++) {
                        this.memoryBuffer.push(new VoxelCell(
                            width / 2 + (Math.random() - 0.5) * 400,
                            height / 2 + (Math.random() - 0.5) * 300,
                            color
                        ));
                    }
                });
            }

            updateHUD() {
                document.getElementById('ptr-count').innerText = this.universeGraph.size * 3; // จำลองจำนวนเส้นกรรม
            }
        }

        // ----------------------------------------------------------------------
        // 2. VOXEL CELL RENDERER (หน่วยแสดงผลสสารไร้ DOM)
        // ----------------------------------------------------------------------
        class VoxelCell {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.targetX = x + (Math.random() - 0.5) * 200;
                this.targetY = y + (Math.random() - 0.5) * 200;
                this.vx = 0; this.vy = 0;
                this.color = color;
                this.size = 3;
            }
            update() {
                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                this.vx += dx * 0.05;
                this.vy += dy * 0.05;
                this.vx *= 0.8; this.vy *= 0.8;
                this.x += this.vx; this.y += this.vy;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        const OS_Kernel = new VoxelCellOS_Kernel();
        let matrixPulseColor = null;

        function triggerMatrixPulse(color) {
            matrixPulseColor = color;
            setTimeout(() => { matrixPulseColor = null; }, 500);
        }

        // ----------------------------------------------------------------------
        // 3. ENGINE LOOP (วัฏจักรของ OS)
        // ----------------------------------------------------------------------
        function runOS() {
            ctx.fillStyle = matrixPulseColor ? 'rgba(20, 40, 30, 0.4)' : 'rgba(1, 4, 2, 0.25)';
            ctx.fillRect(0, 0, width, height);

            // เรนเดอร์เส้นกรรม (Pointer Connections - Matrix Lines)
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            OS_Kernel.memoryBuffer.forEach((cell, idx) => {
                if(idx % 5 === 0) {
                    ctx.moveTo(width/2, height/2);
                    ctx.lineTo(cell.x, cell.y);
                }
            });
            ctx.stroke();

            // อัปเดตและวาด Voxel Cells ของ OS
            OS_Kernel.memoryBuffer.forEach(cell => {
                cell.update();
                cell.draw();
            });

            requestAnimationFrame(runOS);
        }

        // Boot ครั้งแรก
        OS_Kernel.bootFromGraph();
        runOS();
    </script>
</body>
</html>
