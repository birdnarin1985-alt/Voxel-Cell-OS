<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Cell OS : Diagnostics Edition</title>
    <style>
        :root {
            --bg-color: #010204; --hud-bg: rgba(10, 15, 28, 0.85);
            --gold-accent: #f39c12; --gold-glow: rgba(243, 156, 18, 0.4);
            --cyan-accent: #00f3ff; --cyan-glow: rgba(0, 243, 255, 0.4);
            --green-accent: #2ecc71; --error-accent: #e74c3c; --text-main: #ecf0f1;
            --border-glow: rgba(243, 156, 18, 0.3);
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, sans-serif; color: var(--text-main); }
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }
        #ui-root { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px 0; box-sizing: border-box; }
        
        .node-hud, .node-dock { position: relative; margin: 0 auto; width: 92%; max-width: 440px; background: var(--hud-bg); border: 1.5px solid var(--border-glow); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.6), inset 0 0 20px rgba(243,156,18,0.1); border-radius: 16px; padding: 14px; backdrop-filter: blur(14px); pointer-events: auto; box-sizing: border-box; transition: all 0.3s ease; }
        .node-hud:hover, .node-dock:hover { border-color: var(--gold-accent); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.8), inset 0 0 25px var(--gold-glow); }
        
        .node-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 8px; margin-bottom: 12px; color: var(--gold-accent); font-weight: bold; font-size: 1rem; letter-spacing: 0.5px; }
        .status-dot { width: 8px; height: 8px; background-color: var(--green-accent); border-radius: 50%; box-shadow: 0 0 10px var(--green-accent); animation: pulse 2s infinite; }
        
        .node-input { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: var(--cyan-accent); padding: 10px; border-radius: 8px; margin-bottom: 8px; box-sizing: border-box; outline: none; font-size: 0.8rem; font-family: monospace; }
        .node-input:focus { border-color: var(--cyan-accent); box-shadow: 0 0 10px var(--cyan-glow); }
        
        .node-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .node-btn { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.15); padding: 9px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; font-weight: bold; transition: all 0.2s; }
        .node-btn:hover { background: rgba(243, 156, 18, 0.25); border-color: var(--gold-accent); transform: translateY(-1px); }
        
        .node-log { font-family: 'Courier New', monospace; font-size: 0.72rem; color: var(--green-accent); max-height: 110px; overflow-y: auto; margin-bottom: 10px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 6px; border-left: 3px solid var(--green-accent); }
        .node-log .error { color: var(--error-accent); border-left-color: var(--error-accent); }
        
        .dock-input-flex { display: flex; gap: 6px; }
        .btn-send { background: linear-gradient(135deg, var(--gold-accent), #d35400); color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.78rem; white-space: nowrap; box-shadow: 0 4px 12px rgba(211,84,0,0.4); }
        .btn-mic { background: linear-gradient(135deg, #00b4db, #0083b0); color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(0,180,219,0.4); }
        .btn-mic.listening { background: linear-gradient(135deg, #e74c3c, #c0392b); box-shadow: 0 0 15px rgba(231,76,60,0.8); animation: micPulse 1s infinite; }
        
        @keyframes pulse { 0% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } 100% { opacity: 0.4; transform: scale(1); } }
        @keyframes micPulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

        /* Print Engine */
        #print-zone { display: none; background: white; color: black; padding: 40px; font-family: 'Sarabun', sans-serif; }
        @media print {
            body * { visibility: hidden; } #webgl-canvas, #ui-root { display: none !important; }
            #print-zone, #print-zone * { visibility: visible; } #print-zone { display: block; position: absolute; left: 0; top: 0; width: 100%; }
            .print-header { font-size: 26px; font-weight: bold; text-align: center; margin-bottom: 25px; border-bottom: 3px double #333; padding-bottom: 10px; color: #111; }
            .print-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 15px; }
            .print-table th, .print-table td { border: 1px solid #777; padding: 10px; text-align: left; }
            .print-table th { background: #e5e5e5; font-weight: bold; }
            .print-total { text-align: right; font-weight: bold; margin-top: 20px; font-size: 18px; color: #d35400; }
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <div id="ui-root"></div>
    <div id="print-zone"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==========================================
        // 1. SEXY CELLULAR GRAPH STATE SCHEMA
        // ==========================================
        const SexyCellOS = {
            s: {
                k: localStorage.getItem('gemini_api_key') || "",
                v: "main",
                d: { c: "", p: "", m: "" },
                isListening: false
            },
            logs: ["[CELL SYSTEM BOOT] Diagnostics Mode Active."],
            
            spell: function(userInput) {
                return {
                    node: this.s.v,
                    intent: userInput,
                    state: this.s.d
                };
            }
        };

        // ==========================================
        // 2. CELLULAR RENDERING ENGINE
        // ==========================================
        function renderCellDOM() {
            const root = document.getElementById('ui-root'); root.innerHTML = ''; 
            
            const isMain = SexyCellOS.s.v === 'main';
            const hudDiv = document.createElement('div'); hudDiv.className = 'node-hud';
            
            if (isMain) {
                hudDiv.innerHTML = `
                    <div class="node-header"><span>☸️ Voxel Cell OS</span><div class="status-dot"></div></div>
                    <div style="display:flex; gap:6px; margin-bottom:8px;">
                        <input type="password" id="apiKeyInput" class="node-input" style="margin:0;" placeholder="🔑 วางกุญแจ API (AIza...)" value="${SexyCellOS.s.k}" onchange="SexyCellOS.s.k=this.value.replace(/[\\s\\uFEFF\\xA0]/g,'');">
                        <button class="node-btn" onclick="saveKey()">💾 BIND</button>
                    </div>
                    <div class="node-grid">
                        <button class="node-btn" onclick="triggerEvent('0x00f3ff', 'เข้าสู่ระบบตาธิปสแกน')">👁️ สแกนฮาร์ดแวร์</button>
                        <button class="node-btn" onclick="switchView('quotation')">📜 ระบบเสนอราคา</button>
                        <button class="node-btn" onclick="triggerEvent('0x9b59b6', 'วิเคราะห์พอยเตอร์กรรม')">📉 วิเคราะห์โครงสร้าง</button>
                        <button class="node-btn" onclick="triggerEvent('0xe74c3c', 'เดินเครื่องวิวัฒนาการตัวเอง')">🧬 วิวัฒนาการ</button>
                    </div>
                `;
            } else {
                hudDiv.innerHTML = `
                    <div class="node-header"><span>📜 Cellular Quotation</span><div class="status-dot"></div></div>
                    <input type="text" class="node-input" placeholder="นามลูกค้า..." value="${SexyCellOS.s.d.c}" onchange="SexyCellOS.s.d.c=this.value">
                    <input type="text" class="node-input" placeholder="ชื่อโปรเจกต์..." value="${SexyCellOS.s.d.p}" onchange="SexyCellOS.s.d.p=this.value">
                    <input type="text" class="node-input" placeholder="มูลค่า (THB)..." value="${SexyCellOS.s.d.m}" onchange="SexyCellOS.s.d.m=this.value">
                    <div class="node-grid">
                        <button class="node-btn" onclick="switchView('main')">◀ MAIN CORE</button>
                        <button class="node-btn" onclick="generatePDF()">🖨️ EXPORT PDF</button>
                    </div>
                `;
            }
            root.appendChild(hudDiv);

            const dockDiv = document.createElement('div'); dockDiv.className = 'node-dock';
            const logHTML = SexyCellOS.logs.map(l => {
                const isErr = l.includes('❌') || l.includes('ERROR');
                return `<div class="${isErr ? 'error' : ''}">${l}</div>`;
            }).join('');
            const micClass = SexyCellOS.s.isListening ? "btn-mic listening" : "btn-mic";
            
            dockDiv.innerHTML = `
                <div class="node-log" id="chatLog">${logHTML}</div>
                <div class="dock-input-flex">
                    <button class="${micClass}" onclick="activateDivineEar()">🎤</button>
                    <input type="text" id="karmicInput" class="node-input" style="margin:0;" placeholder="ร่ายคาถาพอยเตอร์..." onkeypress="if(event.key==='Enter') castKarmicSpell()">
                    <button class="btn-send" onclick="castKarmicSpell()">EXECUTE</button>
                </div>
            `;
            root.appendChild(dockDiv);
            
            const logEl = document.getElementById('chatLog'); if(logEl) logEl.scrollTop = logEl.scrollHeight;
        }

        window.switchView = function(v) { SexyCellOS.s.v = v; renderCellDOM(); };
        function writeLog(msg, isErr = false) { 
            const prefix = isErr ? "❌" : "✨";
            SexyCellOS.logs.push(`[${new Date().toLocaleTimeString()}] ${prefix}${msg}`); 
            renderCellDOM(); 
        }

        window.saveKey = function() {
            const key = SexyCellOS.s.k;
            if (key.length > 10) {
                localStorage.setItem('gemini_api_key', key);
                writeLog("💾 [SECURE BIND]: ผสานกุญแจเซลล์สำเร็จ!"); speakDharma("เชื่อมต่อระบบประสาทสำเร็จครับ");
            } else {
                writeLog("⚠ [ERROR]: กุญแจสั้นเกินไป", true); speakDharma("กุญแจไม่ถูกต้องครับ");
            }
        };

        // ==========================================
        // 3. DIVINE SENSES (VOICE & EAR)
        // ==========================================
        window.activateDivineEar = function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { writeLog("❌ [ERROR]: เบราว์เซอร์ไม่รองรับหูทิพย์", true); return; }
            
            const recognition = new SpeechRecognition(); recognition.lang = 'th-TH'; recognition.interimResults = false;
            
            recognition.onstart = () => { SexyCellOS.s.isListening = true; writeLog("🎤 [DIVINE EAR]: กำลังฟังคาถา..."); renderCellDOM(); };
            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                document.getElementById('karmicInput').value = speechResult;
                writeLog(`>> วาจาคาถา: "${speechResult}"`);
                castKarmicSpell(); 
            };
            recognition.onend = () => { SexyCellOS.s.isListening = false; renderCellDOM(); }
            recognition.onerror = (e) => { writeLog(`❌ [AUDIO ERROR]: ${e.error}`, true); }
            recognition.start();
        };

        window.speakDharma = function(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text.replace(/[*#\[\]_]/g, ''));
                utterance.lang = 'th-TH'; utterance.rate = 1.15;
                window.speechSynthesis.speak(utterance);
            }
        };
        window.triggerEvent = function(hex, voiceText) { spawnVoxel(hex); writeLog(`[SYS]: ${voiceText}`); speakDharma(voiceText); };

        // ==========================================
        // 4. PDF QUOTATION ENGINE
        // ==========================================
        window.generatePDF = function() {
            const client = SexyCellOS.s.d.c || "ไม่ระบุชื่อ";
            const project = SexyCellOS.s.d.p || "พัฒนาระบบเซลล์กราฟ";
            let price = parseFloat(SexyCellOS.s.d.m) || 0;
            const vat = price * 0.07; const total = price + vat;
            const printZone = document.getElementById('print-zone');
            printZone.innerHTML = `
                <div class="print-header">ใบเสนอราคาเซลล์กราฟ (Quotation)</div>
                <p><strong>ผู้เสนอราคา:</strong> Voxel Cell OS (ช่วยเหลือสังคม)</p>
                <p><strong>ลูกค้า:</strong> ${client}</p><p><strong>วันที่:</strong> ${new Date().toLocaleDateString('th-TH')}</p>
                <table class="print-table">
                    <tr><th>รายการโครงการ</th><th style="text-align:right;">มูลค่า (บาท)</th></tr>
                    <tr><td>${project}</td><td style="text-align:right;">${price.toLocaleString(undefined, {minimumFractionDigits: 2})}</td></tr>
                    <tr><td style="text-align:right;">ภาษีมูลค่าเพิ่ม (VAT 7%)</td><td style="text-align:right;">${vat.toLocaleString(undefined, {minimumFractionDigits: 2})}</td></tr>
                </table>
                <div class="print-total">ราคาสุทธิทั้งสิ้น: ${total.toLocaleString(undefined, {minimumFractionDigits: 2})} บาท</div>
            `;
            writeLog("📜 [PDF ENGINE]: กำลังออกเอกสาร..."); speakDharma("เตรียมพิมพ์ใบเสนอราคาครับ"); spawnVoxel('0xf1c40f');
            setTimeout(() => { window.print(); }, 1500);
        };

        // ==========================================
        // 5. QUANTUM VOXEL ENGINE (THREE.JS)
        // ==========================================
        let scene, camera, renderer, coreGroup, particles = [];
        function initWebGL() {
            scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x010204, 0.04);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000); camera.position.set(0, 2, 10);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const pLight = new THREE.PointLight(0x00f3ff, 2, 20); pLight.position.set(0, 5, 2); scene.add(pLight);
            
            coreGroup = new THREE.Group(); scene.add(coreGroup);
            const coreGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const coreMat = new THREE.MeshPhysicalMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1, wireframe: true });
            coreGroup.add(new THREE.Mesh(coreGeo, coreMat));

            const nodeGeo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
            const nodeMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x002233 });
            for (let i = 0; i < 6; i++) {
                const mesh = new THREE.Mesh(nodeGeo, nodeMat); const angle = (i / 6) * Math.PI * 2;
                mesh.position.set(Math.cos(angle) * 3, 0, Math.sin(angle) * 3); coreGroup.add(mesh);
            }

            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
            animate();
        }

        window.spawnVoxel = function(colorHex) {
            const c = parseInt(colorHex, 16); 
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), new THREE.MeshStandardMaterial({ color: c, emissive: c })); 
            mesh.position.set((Math.random() - 0.5) * 3, -3, (Math.random() - 0.5) * 3);
            scene.add(mesh); particles.push({ mesh: mesh, life: 90, speed: 0.06 });
        };

        function animate() {
            requestAnimationFrame(animate);
            if(coreGroup) { coreGroup.rotation.y += 0.006; coreGroup.rotation.x += 0.002; }
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.mesh.position.y += p.speed; p.mesh.rotation.y += 0.08; p.life--;
                p.mesh.scale.setScalar(p.life / 90);
                if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
            }
            renderer.render(scene, camera);
        }

        // ==========================================
        // 6. SPELL-DRIVEN GRAPH PROTOCOL (DIAGNOSTICS MODE)
        // ==========================================
        window.castKarmicSpell = async function() {
            const input = document.getElementById('karmicInput'); const text = input.value.trim(); if(!text) return;
            const apiKey = SexyCellOS.s.k || localStorage.getItem('gemini_api_key');
            if(!apiKey) { writeLog("⚠ [ERROR]: กรุณาผสานกุญแจ API ก่อน", true); speakDharma("กรุณาวางรหัสก่อนครับ"); return; }

            writeLog(`Spell: ${text}`); input.value = ''; spawnVoxel('0xf39c12');
            
            try {
                const cellSpellPayload = SexyCellOS.spell(text);
                
                const systemPrompt = `คุณคือ Voxel Cell OS สมองกลเซลล์กราฟสำหรับช่วยคนจน 
ตอบเป็น JSON เท่านั้น ห้ามใส่ \`\`\`json
โครงสร้างกระดาษคำตอบกราฟ: {"a":"ชนิด(say/ui/sys)","v":"เสียงพูดสั้นๆ","c":"0xสีHex","d":{ข้อมูลถ้ามี}}
- say: สนทนาทั่วไป
- ui: อัปเดตข้อมูลฟอร์ม (d:{"c":"ชื่อลูกค้า","p":"ชื่องาน","m":"ตัวเลขเงิน"})
- sys: สั่งงานระบบ (d:{"cmd":"print"} đểสั่งพิมพ์เอกสาร PDF)`;
                
                const payload = { contents: [{ parts: [{ text: `${systemPrompt}\n\nเซลล์กราฟพอยเตอร์ขาไป: ${JSON.stringify(cellSpellPayload)}` }] }] };

                // ใช้ endpoint มาตรฐานของ Gemini 1.5 Flash พร้อม API Key
                const fetchUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

                writeLog(`กำลังส่งคาถาไปยังตาสรวง...`);

                const res = await fetch(fetchUrl, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    // ดึงรายละเอียด Error ดิบจาก Google ออกมาแสดงให้เห็นชัดเจน
                    const errReason = data.error && data.error.message ? data.error.message : JSON.stringify(data);
                    writeLog(`[API REJECTED]: ${errReason}`, true);
                    speakDharma("การเชื่อมต่อถูกตีกลับ ตรวจสอบกุญแจหรือโควตาครับ");
                    return;
                }

                if(data.candidates && data.candidates[0].content) {
                    let aiReply = data.candidates[0].content.parts[0].text.trim().replace(/```json/g, '').replace(/```/g, '').trim();
                    try {
                        const answerSheet = JSON.parse(aiReply);
                        writeLog(`[Cell Pointer Success]: ${aiReply}`);
                        
                        if (answerSheet.v) speakDharma(answerSheet.v);
                        spawnVoxel(answerSheet.c || '0x00f3ff');

                        if (answerSheet.a === 'ui' || answerSheet.a === 'sys') {
                            if (answerSheet.d) {
                                if (answerSheet.d.c !== undefined) SexyCellOS.s.d.c = answerSheet.d.c;
                                if (answerSheet.d.p !== undefined) SexyCellOS.s.d.p = answerSheet.d.p;
                                if (answerSheet.d.m !== undefined) SexyCellOS.s.d.m = answerSheet.d.m;
                                
                                if (SexyCellOS.s.d.c || SexyCellOS.s.d.m) switchView('quotation');
                                if (answerSheet.a === 'sys' && answerSheet.d.cmd === 'print') setTimeout(() => generatePDF(), 2500);
                            }
                        }
                    } catch (parseErr) {
                        // กรณีที่ AI ตอบกลับมาเป็นข้อความปกติ ไม่ใช่ JSON
                        writeLog(`[Raw AI Answer]: ${aiReply}`);
                        speakDharma(aiReply);
                    }
                } else {
                    writeLog(`[WARNING]: โครงสร้างข้อมูลตอบกลับไม่สมบูรณ์`, true);
                    speakDharma("ระบบตอบกลับไม่สมบูรณ์ครับ");
                }
            } catch(e) { 
                writeLog(`[NETWORK EXCEPTION]: ${e.message}`, true); 
                speakDharma("เกิดข้อผิดพลาดในการเชื่อมต่อเครือข่าย"); 
            }
        };

        // RUN SYSTEM
        initWebGL(); renderCellDOM();
    </script>
</body>
</html>
