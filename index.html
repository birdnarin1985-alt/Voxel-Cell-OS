<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Cell OS : Sovereign Showcase Edition</title>
    <style>
        :root {
            --bg-color: #010204; --hud-bg: rgba(10, 15, 28, 0.75);
            --gold-accent: #f39c12; --gold-glow: rgba(243, 156, 18, 0.5);
            --cyan-accent: #00f3ff; --cyan-glow: rgba(0, 243, 255, 0.5);
            --green-accent: #2ecc71; --text-main: #ecf0f1;
            --border-glow: rgba(243, 156, 18, 0.3);
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, sans-serif; color: var(--text-main); }
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }
        #ui-root { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px 0; box-sizing: border-box; }
        
        .node-hud, .node-dock { position: relative; margin: 0 auto; width: 92%; max-width: 440px; background: var(--hud-bg); border: 1.5px solid var(--border-glow); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.5), inset 0 0 20px rgba(243,156,18,0.1); border-radius: 16px; padding: 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); pointer-events: auto; box-sizing: border-box; transition: all 0.3s ease; }
        .node-hud:hover, .node-dock:hover { border-color: var(--gold-accent); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.7), inset 0 0 25px var(--gold-glow); }
        
        .node-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 8px; margin-bottom: 12px; color: var(--gold-accent); font-weight: bold; font-size: 1rem; letter-spacing: 0.5px; }
        .status-dot { width: 8px; height: 8px; background-color: var(--green-accent); border-radius: 50%; box-shadow: 0 0 10px var(--green-accent); animation: pulse 2s infinite; }
        
        .node-input { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: var(--cyan-accent); padding: 10px; border-radius: 8px; margin-bottom: 8px; box-sizing: border-box; outline: none; font-size: 0.8rem; font-family: monospace; }
        .node-input:focus { border-color: var(--cyan-accent); box-shadow: 0 0 10px var(--cyan-glow); }
        
        .node-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .node-btn { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.15); padding: 9px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; font-weight: bold; transition: all 0.2s; }
        .node-btn:hover { background: rgba(243, 156, 18, 0.25); border-color: var(--gold-accent); transform: translateY(-1px); }
        
        .node-log { font-family: 'Courier New', monospace; font-size: 0.72rem; color: var(--green-accent); max-height: 90px; overflow-y: auto; margin-bottom: 10px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 6px; border-left: 3px solid var(--green-accent); }
        .dock-input-flex { display: flex; gap: 6px; }
        .btn-send { background: linear-gradient(135deg, var(--gold-accent), #d35400); color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.78rem; white-space: nowrap; box-shadow: 0 4px 12px rgba(211,84,0,0.4); }
        .btn-mic { background: linear-gradient(135deg, #00b4db, #0083b0); color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(0,180,219,0.4); }
        .btn-mic.listening { background: linear-gradient(135deg, #e74c3c, #c0392b); box-shadow: 0 0 15px rgba(231,76,60,0.8); animation: micPulse 1s infinite; }
        
        @keyframes pulse { 0% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } 100% { opacity: 0.4; transform: scale(1); } }
        @keyframes micPulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

        /* Print Engine สำหรับสร้าง PDF ใบเสนอราคา */
        #print-zone { display: none; background: white; color: black; padding: 40px; font-family: 'Sarabun', sans-serif; }
        @media print {
            body * { visibility: hidden; } #webgl-canvas, #ui-root { display: none !important; }
            #print-zone, #print-zone * { visibility: visible; } #print-zone { display: block; position: absolute; left: 0; top: 0; width: 100%; }
            .print-header { font-size: 26px; font-weight: bold; text-align: center; margin-bottom: 25px; border-bottom: 3px double #333; padding-bottom: 10px; color: #111; }
            .print-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 15px; }
            .print-table th, .print-table td { border: 1px solid #777; padding: 10px; text-align: left; }
            .print-table th { background: #e5e5e5; font-weight: bold; }
            .print-total { text-align: right; font-weight: bold; margin-top: 20px; font-size: 18px; color: #d35400; }
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <div id="ui-root"></div>
    <div id="print-zone"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==========================================
        // 1. KARMIC GRAPH STATE (MEMORY)
        // ==========================================
        const CosmicGraphMemory = {
            state: { apiKey: localStorage.getItem('gemini_api_key') || "", currentView: "main", qClient: "", qProject: "", qPrice: "", isListening: false },
            nodes: {
                mainMenu: {
                    type: "panel", class: "node-hud",
                    children: [
                        { type: "header", text: "☸️ Voxel Cell OS" },
                        { type: "flex", children: [
                            { type: "input", id: "apiKeyInput", placeholder: "🔑 วางกุญแจ API (AQ / AIza)...", bind: "apiKey", password: true },
                            { type: "button", text: "💾 BIND", class: "node-btn", action: "saveKeyManually()" }
                        ]},
                        { type: "grid", children: [
                            { type: "button", text: "👁️ สแกนฮาร์ดแวร์", action: "triggerEvent('0x00f3ff', 'เข้าสู่ระบบตาธิปสแกน')" },
                            { type: "button", text: "📜 ระบบเสนอราคา", action: "switchView('quotation')" },
                            { type: "button", text: "📉 วิเคราะห์โครงสร้าง", action: "triggerEvent('0x9b59b6', 'วิเคราะห์พอยเตอร์กรรม')" },
                            { type: "button", text: "🧬 วิวัฒนาการ", action: "triggerEvent('0xe74c3c', 'เดินเครื่องวิวัฒนาการตัวเอง')" }
                        ]}
                    ]
                },
                quotationMenu: {
                    type: "panel", class: "node-hud",
                    children: [
                        { type: "header", text: "📜 Voxel Quotation" },
                        { type: "input", id: "qClient", placeholder: "นามลูกค้า...", bind: "qClient" },
                        { type: "input", id: "qProject", placeholder: "ชื่อโปรเจกต์...", bind: "qProject" },
                        { type: "input", id: "qPrice", placeholder: "มูลค่า (THB)...", bind: "qPrice" },
                        { type: "grid", children: [
                            { type: "button", text: "◀ MAIN CORE", action: "switchView('main')" },
                            { type: "button", text: "🖨️ EXPORT PDF", action: "generatePDF()" }
                        ]}
                    ]
                },
                chatDock: {
                    type: "dock", class: "node-dock",
                    logs: ["[SYSTEM READY] Token Compression & Graph Protocol Active."],
                    children: [
                        { type: "flex", children: [
                            { type: "button", class: "btn-mic", text: "🎤", action: "activateDivineEar()", dynamicClass: "isListening" },
                            { type: "input", id: "karmicInput", placeholder: "สั่งการด้วยเจตนา..." },
                            { type: "button", class: "btn-send", text: "EXECUTE", action: "sendKarmicPointer()" }
                        ]}
                    ]
                }
            }
        };

        // ==========================================
        // 2. GRAPH RENDERING ENGINE
        // ==========================================
        function renderGraphToDOM() {
            const root = document.getElementById('ui-root'); root.innerHTML = ''; 
            
            const activeNode = CosmicGraphMemory.state.currentView === 'main' ? CosmicGraphMemory.nodes.mainMenu : CosmicGraphMemory.nodes.quotationMenu;
            const hudDiv = document.createElement('div'); hudDiv.className = activeNode.class;
            
            activeNode.children.forEach(child => {
                if(child.type === 'header') {
                    hudDiv.innerHTML += `<div class="node-header"><span>${child.text}</span><div class="status-dot"></div></div>`;
                } else if(child.type === 'input') {
                    const val = CosmicGraphMemory.state[child.bind] || "";
                    hudDiv.innerHTML += `<input type="${child.password ? 'password' : 'text'}" id="${child.id}" class="node-input" placeholder="${child.placeholder}" value="${val}" onchange="updateState('${child.bind}', this.value)" autocomplete="off">`;
                } else if (child.type === 'flex') {
                    const flexDiv = document.createElement('div'); flexDiv.style.display = 'flex'; flexDiv.style.gap = '6px'; flexDiv.style.marginBottom = '8px';
                    const inp = child.children[0]; const btn = child.children[1];
                    const val = CosmicGraphMemory.state[inp.bind] || "";
                    flexDiv.innerHTML += `<input type="${inp.password ? 'password' : 'text'}" id="${inp.id}" class="node-input" style="margin:0;" placeholder="${inp.placeholder}" value="${val}" onchange="updateState('${inp.bind}', this.value)">`;
                    flexDiv.innerHTML += `<button class="${btn.class}" onclick="${btn.action}">${btn.text}</button>`;
                    hudDiv.appendChild(flexDiv);
                } else if(child.type === 'grid') {
                    let btns = child.children.map(b => `<button class="node-btn" onclick="${b.action}">${b.text}</button>`).join('');
                    hudDiv.innerHTML += `<div class="node-grid">${btns}</div>`;
                }
            });
            root.appendChild(hudDiv);

            const dockData = CosmicGraphMemory.nodes.chatDock;
            const dockDiv = document.createElement('div'); dockDiv.className = dockData.class;
            const logHTML = dockData.logs.map(l => `<div>${l}</div>`).join('');
            dockDiv.innerHTML += `<div class="node-log" id="chatLog">${logHTML}</div>`;
            
            const flexDockDiv = document.createElement('div'); flexDockDiv.className = 'dock-input-flex';
            dockData.children[0].children.forEach(child => {
                if(child.type === 'input') {
                    flexDockDiv.innerHTML += `<input type="text" id="${child.id}" class="node-input" style="margin:0;" placeholder="${child.placeholder}" onkeypress="if(event.key==='Enter') sendKarmicPointer()">`;
                } else if(child.type === 'button') {
                    const extraClass = (child.dynamicClass && CosmicGraphMemory.state[child.dynamicClass]) ? "listening" : "";
                    flexDockDiv.innerHTML += `<button class="${child.class}${extraClass}" onclick="${child.action}">${child.text}</button>`;
                }
            });
            dockDiv.appendChild(flexDockDiv);
            root.appendChild(dockDiv);
            
            const logEl = document.getElementById('chatLog'); if(logEl) logEl.scrollTop = logEl.scrollHeight;
        }

        window.updateState = function(key, value) { CosmicGraphMemory.state[key] = value; };
        window.switchView = function(viewName) { CosmicGraphMemory.state.currentView = viewName; renderGraphToDOM(); };
        function writeLog(msg) { CosmicGraphMemory.nodes.chatDock.logs.push(`[${new Date().toLocaleTimeString()}]${msg}`); renderGraphToDOM(); }

        window.saveKeyManually = function() {
            const inputEl = document.getElementById('apiKeyInput'); const newKey = inputEl.value.replace(/[\s\uFEFF\xA0]/g, '');
            if (newKey && newKey.length > 20) {
                CosmicGraphMemory.state.apiKey = newKey; localStorage.setItem('gemini_api_key', newKey); inputEl.value = newKey; 
                writeLog("💾 [SECURE BIND]: ผสานกุญแจสำเร็จ!"); speakDharma("ยืนยันการเชื่อมต่อระบบประสาท");
            } else {
                writeLog("⚠ [ERROR]: กุญแจไม่ถูกต้อง"); speakDharma("กุญแจไม่ถูกต้องครับ");
            }
        };

        // ==========================================
        // 3. DIVINE SENSES (VOICE & EAR)
        // ==========================================
        window.activateDivineEar = function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { writeLog("❌ [ERROR]: เบราว์เซอร์ไม่รองรับหูทิพย์"); return; }
            
            const recognition = new SpeechRecognition(); recognition.lang = 'th-TH'; recognition.interimResults = false;
            
            recognition.onstart = () => { CosmicGraphMemory.state.isListening = true; writeLog("🎤 [DIVINE EAR]: กำลังฟัง..."); renderGraphToDOM(); };
            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                document.getElementById('karmicInput').value = speechResult;
                writeLog(`>> วาจา: "${speechResult}"`);
                sendKarmicPointer(); 
            };
            recognition.onend = () => { CosmicGraphMemory.state.isListening = false; renderGraphToDOM(); }
            recognition.onerror = (e) => { writeLog(`❌ [AUDIO ERROR]: ${e.error}`); }
            recognition.start();
        };

        window.speakDharma = function(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text.replace(/[*#\[\]_]/g, ''));
                utterance.lang = 'th-TH'; utterance.rate = 1.15;
                window.speechSynthesis.speak(utterance);
            }
        };
        window.triggerEvent = function(hex, voiceText) { spawnVoxel(hex); writeLog(`⚡ [SYS]: ${voiceText}`); speakDharma(voiceText); };

        // ==========================================
        // 4. PDF QUOTATION ENGINE
        // ==========================================
        window.generatePDF = function() {
            const client = CosmicGraphMemory.state.qClient || "ไม่ระบุชื่อ";
            const project = CosmicGraphMemory.state.qProject || "พัฒนาระบบ Voxel OS";
            let price = parseFloat(CosmicGraphMemory.state.qPrice) || 0;
            const vat = price * 0.07; const total = price + vat;
            const printZone = document.getElementById('print-zone');
            printZone.innerHTML = `
                <div class="print-header">ใบเสนอราคา (Quotation)</div>
                <p><strong>ผู้เสนอราคา:</strong> Voxel Cell OS (ช่วยเหลือสังคม)</p>
                <p><strong>ลูกค้า:</strong> ${client}</p><p><strong>วันที่:</strong> ${new Date().toLocaleDateString('th-TH')}</p>
                <table class="print-table">
                    <tr><th>รายการโครงการ</th><th style="text-align:right;">มูลค่า (บาท)</th></tr>
                    <tr><td>${project}</td><td style="text-align:right;">${price.toLocaleString(undefined, {minimumFractionDigits: 2})}</td></tr>
                    <tr><td style="text-align:right;">ภาษีมูลค่าเพิ่ม (VAT 7%)</td><td style="text-align:right;">${vat.toLocaleString(undefined, {minimumFractionDigits: 2})}</td></tr>
                </table>
                <div class="print-total">ราคาสุทธิทั้งสิ้น: ${total.toLocaleString(undefined, {minimumFractionDigits: 2})} บาท</div>
            `;
            writeLog("📜 [PDF ENGINE]: กำลังออกเอกสาร..."); speakDharma("เตรียมพิมพ์ใบเสนอราคาครับ"); spawnVoxel('0xf1c40f');
            setTimeout(() => { window.print(); }, 1500);
        };

        // ==========================================
        // 5. QUANTUM VOXEL ENGINE (THREE.JS)
        // ==========================================
        let scene, camera, renderer, coreGroup, particles = [];
        function initWebGL() {
            scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x010204, 0.04);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000); camera.position.set(0, 2, 10);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const pLight = new THREE.PointLight(0x00f3ff, 2, 20); pLight.position.set(0, 5, 2); scene.add(pLight);
            
            coreGroup = new THREE.Group(); scene.add(coreGroup);
            const coreGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const coreMat = new THREE.MeshPhysicalMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1, wireframe: true });
            coreGroup.add(new THREE.Mesh(coreGeo, coreMat));

            const nodeGeo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
            const nodeMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x002233 });
            for (let i = 0; i < 6; i++) {
                const mesh = new THREE.Mesh(nodeGeo, nodeMat); const angle = (i / 6) * Math.PI * 2;
                mesh.position.set(Math.cos(angle) * 3, 0, Math.sin(angle) * 3); coreGroup.add(mesh);
            }

            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
            animate();
        }

        window.spawnVoxel = function(colorHex) {
            const c = parseInt(colorHex, 16); 
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), new THREE.MeshStandardMaterial({ color: c, emissive: c })); 
            mesh.position.set((Math.random() - 0.5) * 3, -3, (Math.random() - 0.5) * 3);
            scene.add(mesh); particles.push({ mesh: mesh, life: 90, speed: 0.06 });
        };

        function animate() {
            requestAnimationFrame(animate);
            if(coreGroup) { coreGroup.rotation.y += 0.006; coreGroup.rotation.x += 0.002; }
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.mesh.position.y += p.speed; p.mesh.rotation.y += 0.08; p.life--;
                p.mesh.scale.setScalar(p.life / 90);
                if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
            }
            renderer.render(scene, camera);
        }

        // ==========================================
        // 6. GRAPH-TO-GRAPH PROTOCOL (GEMINI AI BRIDGE)
        // ==========================================
        window.sendKarmicPointer = async function() {
            const input = document.getElementById('karmicInput'); const text = input.value.trim(); if(!text) return;
            const apiKey = localStorage.getItem('gemini_api_key'] || CosmicGraphMemory.state.apiKey;
            if(!apiKey) { writeLog("⚠ [ERROR]: กรุณาผสานกุญแจ API ก่อน"); speakDharma("กรุณาวางรหัสก่อนครับ"); return; }

            writeLog(`<b>User:</b> ${text}`); input.value = ''; spawnVoxel('0xf39c12');
            
            try {
                // โปรโตคอลสั่งการระบบแบบประหยัด Token (Graph Pointer Protocol)
                const systemPrompt = `คุณคือ Voxel OS สมองกลควบคุมระบบสำหรับช่วยคนจน ตอบเป็น JSON เท่านั้น ห้ามใส่ \`\`\`json
โครงสร้างตายตัว: {"a":"ชนิด(say/ui/sys)","v":"เสียงพูดสั้นๆ","c":"0xสีHex","d":{ข้อมูลถ้ามี}}
- say: สนทนาทั่วไป
- ui: อัปเดตข้อมูลฟอร์มใบเสนอราคา (d:{"qClient":"...","qProject":"...","qPrice":"ตัวเลข"})
- sys: สั่งงานระบบ (d:{"cmd":"print"} เพื่อสั่งพิมพ์เอกสาร PDF)`;
                
                const payload = { contents: [{ parts: [{ text: `${systemPrompt}\n\nคำสั่งพอยเตอร์กรรม: ${text}` }] }] };

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                if (!res.ok) { writeLog(`❌ [API ERROR]: ${data.error ? data.error.message : "Error"}`); speakDharma("การเชื่อมต่อถูกตีกลับ"); return; }

                if(data.candidates) {
                    let aiReply = data.candidates[0].content.parts[0].text.trim().replace(/```json/g, '').replace(/```/g, '').trim();
                    try {
                        const graphData = JSON.parse(aiReply);
                        writeLog(`✨ [OS Pointer]: ${aiReply}`); // โชว์ความเทพของ Token Compression
                        
                        if (graphData.v) speakDharma(graphData.v);
                        spawnVoxel(graphData.c || '0x00f3ff');

                        if (graphData.a === 'ui' || graphData.a === 'sys') {
                            if (graphData.d) {
                                if (graphData.d.qClient !== undefined) updateState('qClient', graphData.d.qClient);
                                if (graphData.d.qProject !== undefined) updateState('qProject', graphData.d.qProject);
                                if (graphData.d.qPrice !== undefined) updateState('qPrice', graphData.d.qPrice);
                                
                                if (graphData.d.qClient || graphData.d.qPrice) switchView('quotation');
                                if (graphData.a === 'sys' && graphData.d.cmd === 'print') setTimeout(() => generatePDF(), 2500);
                            }
                        }
                    } catch (e) { writeLog(`✨ [OS Raw]: ${aiReply}`); speakDharma(aiReply); }
                }
            } catch(e) { writeLog(`❌ [NETWORK ERROR]: ${e.message}`); speakDharma("เกิดข้อผิดพลาดในการเชื่อมต่อ"); }
        };

        // RUN SYSTEM
        initWebGL(); renderGraphToDOM();
    </script>
</body>
</html>
